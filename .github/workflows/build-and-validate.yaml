name: Build And Validate

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system validation dependencies
        run: sudo apt-get update && sudo apt-get install --yes bubblewrap

      - name: Enable sealed-source sandbox validation
        run: |
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns >/dev/null
          fi
          bwrap --die-with-parent --ro-bind / / --proc /proc --dev /dev -- /bin/true

      - name: Install Python validation dependencies
        run: python -m pip install pyyaml -r dev-integration/profiles/temporal/controlled_proof/requirements.txt

      - name: Check out locked OOS validation source
        run: |
          source_commit="$(python -c 'import json; print(json.load(open("products/openproject/delivery-art-blocker-workflow-source-lock.json"))["source"]["git_commit"])')"
          [[ "${source_commit}" =~ ^[0-9a-f]{40}$ ]]
          git init /tmp/operator-orchestration-service
          git -C /tmp/operator-orchestration-service remote add origin https://github.com/mfshaf7/operator-orchestration-service.git
          git -C /tmp/operator-orchestration-service fetch --depth=1 origin "${source_commit}"
          git -C /tmp/operator-orchestration-service checkout --detach FETCH_HEAD

      - name: Validate platform repo structure
        run: python scripts/validate_repo_structure.py

      - name: Validate governance docs
        run: python scripts/validate_governance_docs.py

      - name: Validate governed AI model profiles
        run: |
          python scripts/validate_ai_model_profiles.py
          python scripts/test_ai_model_profiles.py
          python scripts/test_governed_ai_gateway_policy.py
          python scripts/test_governed_ai_gateway_runtime.py
          python scripts/test_governed_ai_ollama_adapter.py
          python scripts/test_dev_integration.py
          python scripts/test_dev_integration_compositions.py
          python scripts/test_dev_integration_host_services.py

      - name: Validate operational docs
        run: python scripts/validate_operational_docs.py

      - name: Lint gateway chart
        run: helm lint charts/openclaw-gateway

      - name: Lint platform version chart
        run: helm lint charts/platform-version

      - name: Render prod gateway chart
        run: helm template openclaw-gateway charts/openclaw-gateway -f environments/prod/values/openclaw-gateway.yaml >/tmp/openclaw-gateway-prod.yaml

      - name: Render stage gateway chart
        run: helm template openclaw-gateway-stage charts/openclaw-gateway -f environments/stage/values/openclaw-gateway.yaml >/tmp/openclaw-gateway-stage.yaml

      - name: Render prod platform version chart
        run: helm template platform-version charts/platform-version -f environments/prod/values/platform-version.yaml >/tmp/platform-version-prod.yaml

      - name: Render stage platform version chart
        run: helm template platform-version-stage charts/platform-version -f environments/stage/values/platform-version.yaml >/tmp/platform-version-stage.yaml

      - name: Validate stage environment contract
        run: python products/openclaw/scripts/gateway_release.py validate stage

      - name: Validate prod environment contract
        run: python products/openclaw/scripts/gateway_release.py validate prod

      - name: Validate Terraform formatting
        run: terraform -chdir=terraform/environments/prod fmt -check

      - name: Validate Terraform configuration
        run: terraform -chdir=terraform/environments/prod init -backend=false && terraform -chdir=terraform/environments/prod validate

      - name: Validate Makefile entrypoint
        run: OOS_REPO_ROOT=/tmp/operator-orchestration-service make validate

  publish-metadata:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show promoted version file
        run: cat environments/prod/versions.yaml
