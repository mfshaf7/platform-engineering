name: Build And Validate

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML dependency
        run: python -m pip install pyyaml

      - name: Lint gateway chart
        run: helm lint charts/openclaw-gateway

      - name: Lint platform version chart
        run: helm lint charts/platform-version

      - name: Render prod gateway chart
        run: helm template openclaw-gateway charts/openclaw-gateway -f environments/prod/values/openclaw-gateway.yaml >/tmp/openclaw-gateway-prod.yaml

      - name: Render stage gateway chart
        run: helm template openclaw-gateway-stage charts/openclaw-gateway -f environments/stage/values/openclaw-gateway.yaml >/tmp/openclaw-gateway-stage.yaml

      - name: Render prod platform version chart
        run: helm template platform-version charts/platform-version -f environments/prod/values/platform-version.yaml >/tmp/platform-version-prod.yaml

      - name: Render stage platform version chart
        run: helm template platform-version-stage charts/platform-version -f environments/stage/values/platform-version.yaml >/tmp/platform-version-stage.yaml

      - name: Check environment contract synchronization
        run: python scripts/sync_environment_contract.py --check stage prod

      - name: Validate stage environment contract
        run: python scripts/validate_environment_contract.py stage

      - name: Validate prod environment contract
        run: python scripts/validate_environment_contract.py prod

      - name: Validate Terraform formatting
        run: terraform -chdir=terraform/environments/prod fmt -check

      - name: Validate Terraform configuration
        run: terraform -chdir=terraform/environments/prod init -backend=false && terraform -chdir=terraform/environments/prod validate

      - name: Validate Makefile entrypoint
        run: make validate

  publish-metadata:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show promoted version file
        run: cat environments/prod/versions.yaml
