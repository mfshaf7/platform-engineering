name: Build Gateway Image

on:
  workflow_dispatch:
    inputs:
      environment:
        required: true
        default: stage
        type: choice
        options:
          - stage
          - prod

permissions:
  contents: read
  packages: write

concurrency:
  group: build-gateway-image-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  build-gateway-image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out platform repo
        uses: actions/checkout@v4
        with:
          path: platform-engineering

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install YAML dependency
        run: python -m pip install pyyaml

      - name: Read environment contract
        id: env_meta
        working-directory: platform-engineering
        run: |
          python products/openclaw/scripts/gateway_release.py metadata "$TARGET_ENV" --github-output "$GITHUB_OUTPUT"
        env:
          TARGET_ENV: ${{ inputs.environment }}

      - name: Validate environment contract
        working-directory: platform-engineering
        run: python products/openclaw/scripts/gateway_release.py validate "${{ inputs.environment }}" --require-deterministic-tag

      - name: Validate pinned refs and build contract
        run: |
          test "${{ steps.env_meta.outputs.telegram_ref }}" != "replace-me"
          test "${{ steps.env_meta.outputs.host_bridge_ref }}" != "replace-me"
          test "${{ steps.env_meta.outputs.runtime_distribution_ref }}" != "replace-me"
          test "${{ steps.env_meta.outputs.publish_repository }}" != "replace-me"
          test "${{ steps.env_meta.outputs.publish_tag_prefix }}" != "replace-me"
          test "${{ steps.env_meta.outputs.dockerfile }}" = "deployment/Dockerfile.plugin-install.example"

      - name: Verify pinned refs exist upstream
        env:
          CROSS_REPO_READ_TOKEN: ${{ secrets.CROSS_REPO_READ_TOKEN }}
        run: |
          set -euo pipefail

          check_ref() {
            local repo="$1"
            local ref="$2"
            local url="https://api.github.com/repos/${repo}/commits/${ref}"
            if ! curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${CROSS_REPO_READ_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$url" >/dev/null; then
              echo "Pinned ref not found upstream: repo=${repo} ref=${ref}" >&2
              exit 1
            fi
          }

          check_ref "mfshaf7/openclaw-telegram-enhanced" "${{ steps.env_meta.outputs.telegram_ref }}"
          check_ref "mfshaf7/openclaw-host-bridge" "${{ steps.env_meta.outputs.host_bridge_ref }}"
          check_ref "mfshaf7/openclaw-runtime-distribution" "${{ steps.env_meta.outputs.runtime_distribution_ref }}"

      - name: Check out Telegram source
        uses: actions/checkout@v4
        with:
          repository: mfshaf7/openclaw-telegram-enhanced
          ref: ${{ steps.env_meta.outputs.telegram_ref }}
          path: openclaw-telegram-enhanced
          token: ${{ secrets.CROSS_REPO_READ_TOKEN }}

      - name: Check out host-bridge source
        uses: actions/checkout@v4
        with:
          repository: mfshaf7/openclaw-host-bridge
          ref: ${{ steps.env_meta.outputs.host_bridge_ref }}
          path: openclaw-host-bridge
          token: ${{ secrets.CROSS_REPO_READ_TOKEN }}

      - name: Check out runtime-distribution source
        uses: actions/checkout@v4
        with:
          repository: mfshaf7/openclaw-runtime-distribution
          ref: ${{ steps.env_meta.outputs.runtime_distribution_ref }}
          path: openclaw-runtime-distribution
          token: ${{ secrets.CROSS_REPO_READ_TOKEN }}

      - name: Prepare bundled Telegram and host-control packaged-runtime inputs
        working-directory: openclaw-runtime-distribution
        run: ./deployment/package-local-plugins.sh "$PWD"
        env:
          OPENCLAW_TELEGRAM_REPO: ${{ github.workspace }}/openclaw-telegram-enhanced

      - name: Validate gateway source bundle compatibility
        working-directory: platform-engineering
        run: |
          python products/openclaw/scripts/validate_gateway_source_bundle.py \
            --telegram-repo "${{ github.workspace }}/openclaw-telegram-enhanced" \
            --deployment-repo "${{ github.workspace }}/openclaw-runtime-distribution"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push gateway image
        id: build_push
        uses: docker/build-push-action@v6
        with:
          context: ./openclaw-runtime-distribution
          file: ./openclaw-runtime-distribution/${{ steps.env_meta.outputs.dockerfile }}
          push: true
          platforms: ${{ steps.env_meta.outputs.publish_platforms }}
          tags: ${{ steps.env_meta.outputs.publish_repository }}:${{ steps.env_meta.outputs.publish_tag }}
          build-args: |
            OPENCLAW_BASE_IMAGE=${{ steps.env_meta.outputs.base_image }}
          labels: |
            org.opencontainers.image.title=OpenClaw Gateway
            org.opencontainers.image.description=OpenClaw gateway image with bundled Telegram overlay and managed host-control plugin built from pinned platform source refs
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.env_meta.outputs.publish_tag }}
            openclaw.source-bundle-ref=${{ steps.env_meta.outputs.source_bundle_ref }}
            openclaw.telegram-ref=${{ steps.env_meta.outputs.telegram_ref }}
            openclaw.host-bridge-ref=${{ steps.env_meta.outputs.host_bridge_ref }}
            openclaw.runtime-distribution-ref=${{ steps.env_meta.outputs.runtime_distribution_ref }}
            openclaw.platform-engineering-ref=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Smoke test bundled Telegram overlay and host-control runtime
        env:
          IMAGE_REF: ${{ steps.env_meta.outputs.publish_repository }}@${{ steps.build_push.outputs.digest }}
        run: |
          set -euo pipefail

          mkdir -p smoke-test
          cat > smoke-test/openclaw.smoke.json <<'JSON'
          {
            "gateway": {
              "mode": "local",
              "auth": {
                "mode": "token",
                "token": "smoke-test-token"
              }
            },
            "plugins": {
              "allow": [
                "host-control"
              ],
              "entries": {
                "host-control": {
                  "enabled": true,
                  "config": {
                    "enabled": true,
                    "bridgeUrl": "http://127.0.0.1:48721",
                    "authTokenEnv": "OPENCLAW_GATEWAY_TOKEN",
                    "allowWriteOperations": true,
                    "allowExportOperations": true,
                    "allowBrowserInspect": false
                  }
                }
              }
            }
          }
          JSON

          set +e
          timeout 20s docker run --rm \
            -e OPENCLAW_CONFIG_PATH=/tmp/openclaw.smoke.json \
            -e OPENCLAW_GATEWAY_TOKEN=smoke-test-token \
            -v "${PWD}/smoke-test/openclaw.smoke.json:/tmp/openclaw.smoke.json:ro" \
            "${IMAGE_REF}" \
            node dist/index.js gateway --bind 127.0.0.1 --port 18789 \
            > smoke-test/gateway.log 2>&1
          gateway_status=$?
          set -e

          cat smoke-test/gateway.log

          if [ "$gateway_status" -ne 0 ] && [ "$gateway_status" -ne 124 ]; then
            echo "Gateway smoke test failed before timeout" >&2
            exit "$gateway_status"
          fi

          if grep -q 'plugin not found: host-control' smoke-test/gateway.log; then
            echo "Built image does not register the host-control plugin at runtime." >&2
            exit 1
          fi

          if grep -q 'stale config entry ignored' smoke-test/gateway.log; then
            echo "Built image emitted stale plugin-config warnings during host-control smoke test." >&2
            exit 1
          fi

          if grep -q 'duplicate plugin id detected; global plugin will be overridden by bundled plugin' smoke-test/gateway.log; then
            echo "Built image still tries to override bundled Telegram at runtime." >&2
            exit 1
          fi

          docker run --rm \
            -e OPENCLAW_CONFIG_PATH=/tmp/openclaw.smoke.json \
            -e OPENCLAW_GATEWAY_TOKEN=smoke-test-token \
            -v "${PWD}/smoke-test/openclaw.smoke.json:/tmp/openclaw.smoke.json:ro" \
            "${IMAGE_REF}" \
            openclaw plugins list > smoke-test/plugins-list.log 2>&1

          cat smoke-test/plugins-list.log

          if ! grep -q 'Host Control' smoke-test/plugins-list.log; then
            echo "Built image did not register host-control in the runtime plugin registry." >&2
            exit 1
          fi

          if ! grep -q 'Telegram' smoke-test/plugins-list.log || ! grep -Eq 'stock:telegram/index\.(js|ts)' smoke-test/plugins-list.log; then
            echo "Built image did not keep the bundled Telegram channel active." >&2
            exit 1
          fi

          if grep -q 'global:telegram/' smoke-test/plugins-list.log; then
            echo "Built image still contains a global same-id Telegram override." >&2
            exit 1
          fi

          docker run --rm "${IMAGE_REF}" sh -lc '
            grep -R -n -m 1 "tryHandleForcedHostControlReadTelegram" /app/extensions/telegram &&
            grep -R -n -m 1 "parseDirectReadIntent" /app/extensions/telegram &&
            grep -R -n -m 1 "appendHostControlTopicSystemPrompt" /app/extensions/telegram &&
            test ! -d /home/node/.openclaw/extensions/telegram
          ' > smoke-test/telegram-overlay.log 2>&1

          cat smoke-test/telegram-overlay.log

          docker run --rm "${IMAGE_REF}" node - <<'NODE' > smoke-test/telegram-runtime-contract.log 2>&1
          const fs = require("fs");
          const manifest = JSON.parse(fs.readFileSync("/app/extensions/telegram/openclaw.plugin.json", "utf8"));
          const runtimeApi = fs.readFileSync("/app/extensions/telegram/runtime-api.ts", "utf8");
          const tokenSource = fs.readFileSync("/app/extensions/telegram/src/token.ts", "utf8");

          if (!tokenSource.includes("TELEGRAM_BOT_TOKEN")) {
            throw new Error("Telegram overlay token source no longer keys off TELEGRAM_BOT_TOKEN.");
          }
          if (!manifest.configSchema || Object.keys(manifest.configSchema.properties ?? {}).length !== 0) {
            throw new Error("Telegram overlay manifest config schema changed; review runtime config assumptions before upgrading.");
          }
          if (!runtimeApi.includes("monitorTelegramProvider") || !runtimeApi.includes("setTelegramRuntime")) {
            throw new Error("Telegram overlay runtime-api no longer exports the expected monitoring/runtime hooks.");
          }

          console.log("Telegram overlay runtime contract OK");
          NODE

          cat smoke-test/telegram-runtime-contract.log

      - name: Publish build summary
        run: |
          {
            echo "## Gateway Image Build"
            echo
            echo '- Environment: `${{ inputs.environment }}`'
            echo '- Image: `${{ steps.env_meta.outputs.publish_repository }}:${{ steps.env_meta.outputs.publish_tag }}`'
            echo '- Digest: `${{ steps.build_push.outputs.digest }}`'
            echo '- Telegram SHA: `${{ steps.env_meta.outputs.telegram_ref }}`'
            echo '- Host bridge SHA: `${{ steps.env_meta.outputs.host_bridge_ref }}`'
            echo '- Runtime distribution SHA: `${{ steps.env_meta.outputs.runtime_distribution_ref }}`'
            echo '- Platform SHA: `${{ github.sha }}`'
            echo
            echo 'Bundled Telegram + host-control packaged-runtime seam:'
            echo
            echo '- Telegram was staged into the packaged bundled-runtime seam under `/app/dist/extensions/telegram` during image build'
            echo '- Host-control was staged from its packlist into `/app/extensions/host-control` during image build'
            echo '- Build smoke test confirmed bundled Telegram stayed active, the compiled Telegram runtime contract still keys off `TELEGRAM_BOT_TOKEN`, no global same-id Telegram override remained, and host-control stayed registered from the bundled seam'
            echo
            echo 'Record this immutable image reference in the target environment before promotion:'
            echo
            echo '`${{ steps.env_meta.outputs.publish_repository }}@${{ steps.build_push.outputs.digest }}`'
            echo
            echo 'Prod guardrail: a successful build is not a safe cutover by itself.'
            echo 'Prod gateway binds host port 18789 on a single node, so warm the exact target digest before committing the prod contract change.'
            echo 'Use gateway_release.py record for prod so the external pre-pull happens before Argo sees the new digest.'
            echo 'Do not manually delete the old prod gateway pod as a first response to a slow rollout.'
          } >> "$GITHUB_STEP_SUMMARY"
