name: Build Gateway Image

on:
  workflow_dispatch:
    inputs:
      environment:
        required: true
        default: stage
        type: choice
        options:
          - stage
          - prod

permissions:
  contents: read
  packages: write

concurrency:
  group: build-gateway-image-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  build-gateway-image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out platform repo
        uses: actions/checkout@v4
        with:
          path: platform-engineering

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML dependency
        run: python -m pip install pyyaml

      - name: Read environment contract
        id: env_meta
        working-directory: platform-engineering
        run: |
          python - <<'PY'
          import os
          import yaml
          env = os.environ["TARGET_ENV"]
          with open(f"environments/{env}/versions.yaml", "r", encoding="utf-8") as fh:
              data = yaml.safe_load(fh)
          source_bundle = "|".join([
              env,
              data['sourceRepos']['telegramEnhanced']['commit'],
              data['sourceRepos']['hostBridge']['commit'],
              data['sourceRepos']['isolatedDeployment']['commit'],
              data['gateway']['build']['baseImage'],
              data['gateway']['build']['dockerfile'],
          ])
          import hashlib
          source_bundle_ref = hashlib.sha256(source_bundle.encode("utf-8")).hexdigest()[:12]
          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a", encoding="utf-8") as fh:
              fh.write(f"telegram_ref={data['sourceRepos']['telegramEnhanced']['commit']}\n")
              fh.write(f"host_bridge_ref={data['sourceRepos']['hostBridge']['commit']}\n")
              fh.write(f"deployment_ref={data['sourceRepos']['isolatedDeployment']['commit']}\n")
              fh.write(f"publish_repository={data['gateway']['publish']['repository']}\n")
              fh.write(f"publish_tag_prefix={data['gateway']['publish']['tagPrefix']}\n")
              fh.write(f"publish_platforms={','.join(data['gateway']['publish']['platforms'])}\n")
              fh.write(f"publish_tag={data['gateway']['publish']['tagPrefix']}-{source_bundle_ref}\n")
              fh.write(f"source_bundle_ref={source_bundle_ref}\n")
              fh.write(f"base_image={data['gateway']['build']['baseImage']}\n")
              fh.write(f"dockerfile={data['gateway']['build']['dockerfile']}\n")
          PY
        env:
          TARGET_ENV: ${{ inputs.environment }}

      - name: Validate pinned source refs
        run: |
          test "${{ steps.env_meta.outputs.telegram_ref }}" != "replace-me"
          test "${{ steps.env_meta.outputs.host_bridge_ref }}" != "replace-me"
          test "${{ steps.env_meta.outputs.deployment_ref }}" != "replace-me"
          test "${{ steps.env_meta.outputs.publish_repository }}" != "replace-me"
          test "${{ steps.env_meta.outputs.publish_tag_prefix }}" != "replace-me"

      - name: Verify pinned refs exist upstream
        env:
          CROSS_REPO_READ_TOKEN: ${{ secrets.CROSS_REPO_READ_TOKEN }}
        run: |
          set -euo pipefail

          check_ref() {
            local repo="$1"
            local ref="$2"
            local url="https://api.github.com/repos/${repo}/commits/${ref}"
            if ! curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${CROSS_REPO_READ_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$url" >/dev/null; then
              echo "Pinned ref not found upstream: repo=${repo} ref=${ref}" >&2
              exit 1
            fi
          }

          check_ref "mfshaf7/openclaw-telegram-enhanced" "${{ steps.env_meta.outputs.telegram_ref }}"
          check_ref "mfshaf7/openclaw-host-bridge" "${{ steps.env_meta.outputs.host_bridge_ref }}"
          check_ref "mfshaf7/openclaw-isolated-deployment" "${{ steps.env_meta.outputs.deployment_ref }}"

      - name: Check out Telegram source
        uses: actions/checkout@v4
        with:
          repository: mfshaf7/openclaw-telegram-enhanced
          ref: ${{ steps.env_meta.outputs.telegram_ref }}
          path: openclaw-telegram-enhanced
          token: ${{ secrets.CROSS_REPO_READ_TOKEN }}

      - name: Check out host-bridge source
        uses: actions/checkout@v4
        with:
          repository: mfshaf7/openclaw-host-bridge
          ref: ${{ steps.env_meta.outputs.host_bridge_ref }}
          path: openclaw-host-bridge
          token: ${{ secrets.CROSS_REPO_READ_TOKEN }}

      - name: Check out isolated-deployment source
        uses: actions/checkout@v4
        with:
          repository: mfshaf7/openclaw-isolated-deployment
          ref: ${{ steps.env_meta.outputs.deployment_ref }}
          path: openclaw-isolated-deployment
          token: ${{ secrets.CROSS_REPO_READ_TOKEN }}

      - name: Sync deployment build copy and verify workspace
        working-directory: openclaw-isolated-deployment
        run: |
          ./deployment/sync-telegram-build-copy.sh "$PWD"
          ./deployment/verify-workspace-sync.sh "$PWD"
          ./deployment/verify-telegram-router-contract.sh "$PWD"
          ./deployment/verify-bridge-workspace.sh "$PWD"
          ./deployment/verify-host-control-contract.sh "$PWD"
        env:
          OPENCLAW_TELEGRAM_REPO: ${{ github.workspace }}/openclaw-telegram-enhanced

      - name: Validate gateway source bundle compatibility
        working-directory: platform-engineering
        run: |
          python scripts/validate_gateway_source_bundle.py \
            --telegram-repo "${{ github.workspace }}/openclaw-telegram-enhanced" \
            --deployment-repo "${{ github.workspace }}/openclaw-isolated-deployment"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push gateway image
        id: build_push
        uses: docker/build-push-action@v6
        with:
          context: ./openclaw-isolated-deployment
          file: ./openclaw-isolated-deployment/${{ steps.env_meta.outputs.dockerfile }}
          push: true
          platforms: ${{ steps.env_meta.outputs.publish_platforms }}
          tags: ${{ steps.env_meta.outputs.publish_repository }}:${{ steps.env_meta.outputs.publish_tag }}
          build-args: |
            OPENCLAW_BASE_IMAGE=${{ steps.env_meta.outputs.base_image }}
          labels: |
            org.opencontainers.image.title=OpenClaw Gateway
            org.opencontainers.image.description=Bundled OpenClaw gateway image built from pinned platform source refs
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.env_meta.outputs.publish_tag }}
            openclaw.environment=${{ inputs.environment }}
            openclaw.source-bundle-ref=${{ steps.env_meta.outputs.source_bundle_ref }}
            openclaw.telegram-ref=${{ steps.env_meta.outputs.telegram_ref }}
            openclaw.host-bridge-ref=${{ steps.env_meta.outputs.host_bridge_ref }}
            openclaw.isolated-deployment-ref=${{ steps.env_meta.outputs.deployment_ref }}
            openclaw.platform-engineering-ref=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Publish build summary
        run: |
          {
            echo "## Gateway Image Build"
            echo
            echo "- Environment: \`${{ inputs.environment }}\`"
            echo "- Image: \`${{ steps.env_meta.outputs.publish_repository }}:${{ steps.env_meta.outputs.publish_tag }}\`"
            echo "- Digest: \`${{ steps.build_push.outputs.digest }}\`"
            echo "- Telegram SHA: \`${{ steps.env_meta.outputs.telegram_ref }}\`"
            echo "- Host bridge SHA: \`${{ steps.env_meta.outputs.host_bridge_ref }}\`"
            echo "- Isolated deployment SHA: \`${{ steps.env_meta.outputs.deployment_ref }}\`"
            echo "- Platform SHA: \`${{ github.sha }}\`"
            echo
            echo "Record this immutable image reference in the target environment before promotion:"
            echo
            echo "\`${{ steps.env_meta.outputs.publish_repository }}@${{ steps.build_push.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
