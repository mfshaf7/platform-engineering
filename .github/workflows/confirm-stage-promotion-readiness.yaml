name: Confirm Stage Promotion Readiness

run-name: ${{ inputs.console_request_id && format('Console release {0}', inputs.console_request_id) || format('Manual release {0}', github.run_id) }}

on:
  workflow_dispatch:
    inputs:
      verification_evidence_ref:
        required: true
        type: string
        default: ""
      verification_results:
        required: true
        type: string
        default: "runtime-start=passed,primary-user-path=passed,artifact-delivery=passed,screenshot-delivery=passed,privileged-path-posture=not_applicable"
      verification_note:
        required: false
        type: string
        default: ""
      approval_note:
        required: false
        type: string
        default: ""
      console_request_id:
        description: "Native Console request identity; leave empty for manual dispatch"
        required: false
        type: string
        default: ""
      console_intent:
        description: "Native reviewed Console intent; leave empty for manual dispatch"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: confirm-stage-promotion-readiness
  cancel-in-progress: false

jobs:
  confirm:
    environment: stage
    runs-on: ubuntu-latest
    env:
      CONSOLE_REQUEST_ID: ${{ inputs.console_request_id }}
      CONSOLE_INTENT: ${{ inputs.console_intent }}
      RELEASE_ACCOUNTABLE_OPERATOR: ${{ github.actor }}
      RELEASE_VERIFICATION_EVIDENCE_REF: ${{ inputs.verification_evidence_ref }}
      RELEASE_VERIFICATION_RESULTS: ${{ inputs.verification_results }}
      RELEASE_VERIFICATION_NOTE: ${{ inputs.verification_note }}
      RELEASE_APPROVAL_NOTE: ${{ inputs.approval_note }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tool dependencies
        run: python -m pip install pyyaml

      - name: Verify native request and reviewed source
        run: python products/openclaw/scripts/console_release_workflow.py guard readiness

      - name: Validate stage environment contract
        run: python products/openclaw/scripts/gateway_release.py validate stage

      - name: Capture current stage lifecycle status
        id: stage_status
        run: echo "value=$(python products/openclaw/scripts/set_stage_environment_state.py status)" >> "$GITHUB_OUTPUT"

      - name: Record structured stage verification
        run: |
          python products/openclaw/scripts/gateway_release.py verification record \
            --verified-by "$RELEASE_ACCOUNTABLE_OPERATOR" \
            --evidence-ref "$RELEASE_VERIFICATION_EVIDENCE_REF" \
            --note "$RELEASE_VERIFICATION_NOTE" \
            --check-results "$RELEASE_VERIFICATION_RESULTS"

      - name: Approve stage promotion readiness
        run: python products/openclaw/scripts/gateway_release.py readiness approve --approved-by "$RELEASE_ACCOUNTABLE_OPERATOR" --note "$RELEASE_APPROVAL_NOTE"

      - name: Capture readiness status
        id: readiness
        run: |
          {
            echo "status_line<<__READINESS__"
            python products/openclaw/scripts/gateway_release.py readiness status
            echo "__READINESS__"
          } >> "$GITHUB_OUTPUT"

      - name: Show readiness diff
        run: git diff -- environments/stage/verification.yaml environments/stage/promotion-readiness.yaml

      - name: Detect whether a commit is needed
        id: diff
        run: |
          if git diff --quiet -- environments/stage/verification.yaml environments/stage/promotion-readiness.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push readiness branch
        if: steps.diff.outputs.changed == 'true'
        id: readiness_branch
        env:
          READINESS_BRANCH: stage/approve-${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$READINESS_BRANCH"
          git add environments/stage/verification.yaml environments/stage/promotion-readiness.yaml
          git commit -m "Record stage verification and approve candidate for prod promotion"
          git push origin "$READINESS_BRANCH"
          echo "readiness_branch=$READINESS_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open original source review for native request
        if: steps.readiness_branch.outcome == 'success' && inputs.console_request_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: python products/openclaw/scripts/console_release_workflow.py publish readiness

      - name: Publish owner workflow summary
        run: python products/openclaw/scripts/console_release_workflow.py summary readiness
