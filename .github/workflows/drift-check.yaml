name: Drift Check

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  drift-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show approved production version pins
        run: cat environments/prod/versions.yaml

      - name: Ensure production overlays exist
        run: test -f environments/prod/values/openclaw-gateway.yaml && test -f environments/prod/values/platform-version.yaml

      - name: Ensure Argo production applications exist
        run: test -f environments/prod/argocd/openclaw-gateway-app.yaml && test -f environments/prod/argocd/platform-version-app.yaml
