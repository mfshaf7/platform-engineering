name: Manage Prod Environment

run-name: ${{ inputs.console_request_id && format('Console release {0}', inputs.console_request_id) || format('Manual release {0}', github.run_id) }}

on:
  workflow_dispatch:
    inputs:
      state:
        required: true
        default: suspended
        type: choice
        options:
          - live
          - traffic-stopped
          - suspended
          - quarantined
      reason:
        required: true
        type: string
        default: incident-containment
      incident_ref:
        required: false
        type: string
        default: ""
      operation_note:
        required: false
        type: string
        default: ""
      console_request_id:
        description: "Native Console request identity; leave empty for manual dispatch"
        required: false
        type: string
        default: ""
      console_intent:
        description: "Native reviewed Console intent; leave empty for manual dispatch"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: manage-prod-environment
  cancel-in-progress: false

jobs:
  update-prod-environment:
    environment: prod
    runs-on: ubuntu-latest
    env:
      CONSOLE_REQUEST_ID: ${{ inputs.console_request_id }}
      CONSOLE_INTENT: ${{ inputs.console_intent }}
      RELEASE_ACCOUNTABLE_OPERATOR: ${{ github.actor }}
      RELEASE_STATE: ${{ inputs.state }}
      RELEASE_REASON: ${{ inputs.reason }}
      RELEASE_INCIDENT_REF: ${{ inputs.incident_ref }}
      RELEASE_OPERATION_NOTE: ${{ inputs.operation_note }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tool dependencies
        run: python -m pip install pyyaml

      - name: Verify native request and reviewed source
        run: python products/openclaw/scripts/console_release_workflow.py guard runtime

      - name: Update prod environment state
        run: >
          python products/openclaw/scripts/set_prod_environment_state.py
          "$RELEASE_STATE"
          --changed-by "$RELEASE_ACCOUNTABLE_OPERATOR"
          --reason "$RELEASE_REASON"
          --incident-ref "$RELEASE_INCIDENT_REF"
          --note "$RELEASE_OPERATION_NOTE"

      - name: Capture prod verification status
        id: verification
        run: |
          {
            echo "status_line<<__VERIFICATION__"
            python products/openclaw/scripts/gateway_release.py prod-verification status
            echo "__VERIFICATION__"
          } >> "$GITHUB_OUTPUT"

      - name: Show prod lifecycle diff
        run: git diff -- environments/prod/openclaw-lifecycle.yaml environments/prod/argocd/kustomization.yaml environments/prod/argocd/openclaw-prod-lifecycle-configmap.yaml environments/prod/verification.yaml environments/prod/values/openclaw-gateway.yaml environments/prod/values/platform-version.yaml

      - name: Detect whether a commit is needed
        id: diff
        run: |
          if git diff --quiet -- environments/prod/openclaw-lifecycle.yaml environments/prod/argocd/kustomization.yaml environments/prod/argocd/openclaw-prod-lifecycle-configmap.yaml environments/prod/verification.yaml environments/prod/values/openclaw-gateway.yaml environments/prod/values/platform-version.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push prod lifecycle branch
        if: steps.diff.outputs.changed == 'true'
        id: lifecycle_branch
        env:
          LIFECYCLE_BRANCH: prod/openclaw-${{ inputs.state }}-${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$LIFECYCLE_BRANCH"
          git add environments/prod/openclaw-lifecycle.yaml environments/prod/argocd/kustomization.yaml environments/prod/argocd/openclaw-prod-lifecycle-configmap.yaml environments/prod/verification.yaml environments/prod/values/openclaw-gateway.yaml environments/prod/values/platform-version.yaml
          git commit -m "Set prod OpenClaw lifecycle to $RELEASE_STATE"
          git push origin "$LIFECYCLE_BRANCH"
          echo "lifecycle_branch=$LIFECYCLE_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open original source review for native request
        if: steps.lifecycle_branch.outcome == 'success' && inputs.console_request_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: python products/openclaw/scripts/console_release_workflow.py publish runtime

      - name: Publish owner workflow summary
        run: python products/openclaw/scripts/console_release_workflow.py summary runtime
