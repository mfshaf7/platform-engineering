name: Manage Stage Environment

on:
  workflow_dispatch:
    inputs:
      action:
        required: true
        default: suspend
        type: choice
        options:
          - suspend
          - resume
      components:
        required: true
        default: gateway,version
        type: string
      operation_note:
        required: false
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: manage-stage-environment
  cancel-in-progress: false

jobs:
  update-stage-environment:
    environment: stage
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tool dependencies
        run: python -m pip install pyyaml

      - name: Update stage environment state
        run: python products/openclaw/scripts/set_stage_environment_state.py "${{ inputs.action }}" --components "${{ inputs.components }}"

      - name: Capture stage readiness status
        id: readiness
        run: |
          {
            echo "status_line<<__READINESS__"
            python products/openclaw/scripts/gateway_release.py readiness status
            echo "__READINESS__"
          } >> "$GITHUB_OUTPUT"

      - name: Show stage environment diff
        run: git diff -- environments/stage/argocd/kustomization.yaml environments/stage/verification.yaml environments/stage/promotion-readiness.yaml

      - name: Detect whether a commit is needed
        id: diff
        run: |
          if git diff --quiet -- environments/stage/argocd/kustomization.yaml environments/stage/verification.yaml environments/stage/promotion-readiness.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push stage lifecycle branch
        if: steps.diff.outputs.changed == 'true'
        id: lifecycle_branch
        env:
          LIFECYCLE_BRANCH: stage/${{ inputs.action }}-${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$LIFECYCLE_BRANCH"
          git add environments/stage/argocd/kustomization.yaml environments/stage/verification.yaml environments/stage/promotion-readiness.yaml
          git commit -m "Set stage components (${{ inputs.components }}) to ${{ inputs.action }}"
          git push --force-with-lease origin "$LIFECYCLE_BRANCH"
          echo "lifecycle_branch=$LIFECYCLE_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Publish lifecycle summary
        run: |
          {
            echo "## Stage Environment"
            echo
            echo '- Requested action: `${{ inputs.action }}`'
            echo '- Target components: `${{ inputs.components }}`'
            echo '- Note: `${{ inputs.operation_note }}`'
            echo '- Readiness: `${{ steps.readiness.outputs.status_line }}`'
            if [ "${{ steps.diff.outputs.changed }}" = "true" ]; then
              echo '- Lifecycle branch: `${{ steps.lifecycle_branch.outputs.lifecycle_branch }}`'
              echo '- Compare URL: `https://github.com/${{ github.repository }}/compare/main...${{ steps.lifecycle_branch.outputs.lifecycle_branch }}?expand=1`'
              echo
              echo 'Merging this branch changes the desired stage lifecycle, resets stage verification, and resets stage promotion approval.'
            else
              echo '- No git changes were required because stage was already in the requested state.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
