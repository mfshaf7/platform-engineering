name: Promote Environment

run-name: ${{ inputs.console_request_id && format('Console release {0}', inputs.console_request_id) || format('Manual release {0}', github.run_id) }}

on:
  workflow_dispatch:
    inputs:
      source_environment:
        required: true
        default: stage
        type: choice
        options:
          - stage
      target_environment:
        required: true
        default: prod
        type: choice
        options:
          - prod
      promotion_note:
        required: false
        type: string
        default: ""
      suspend_stage_environment:
        required: true
        default: true
        type: boolean
      console_request_id:
        description: "Native Console request identity; leave empty for manual dispatch"
        required: false
        type: string
        default: ""
      console_intent:
        description: "Native reviewed Console intent; leave empty for manual dispatch"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: promote-environment-${{ inputs.source_environment }}-${{ inputs.target_environment }}
  cancel-in-progress: false

jobs:
  promote:
    environment: ${{ inputs.target_environment }}
    runs-on: ubuntu-latest
    env:
      CONSOLE_REQUEST_ID: ${{ inputs.console_request_id }}
      CONSOLE_INTENT: ${{ inputs.console_intent }}
      RELEASE_ACCOUNTABLE_OPERATOR: ${{ github.actor }}
      RELEASE_SOURCE_ENVIRONMENT: ${{ inputs.source_environment }}
      RELEASE_TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
      RELEASE_PROMOTION_NOTE: ${{ inputs.promotion_note }}
      RELEASE_SUSPEND_STAGE_ENVIRONMENT: ${{ inputs.suspend_stage_environment }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tool dependencies
        run: python -m pip install pyyaml

      - name: Verify native request and reviewed source
        run: python products/openclaw/scripts/console_release_workflow.py guard promotion

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Guard invalid promotion pair
        run: |
          test "$RELEASE_SOURCE_ENVIRONMENT" = "stage"
          test "$RELEASE_TARGET_ENVIRONMENT" = "prod"

      - name: Validate source environment contract
        run: python products/openclaw/scripts/gateway_release.py validate "$RELEASE_SOURCE_ENVIRONMENT"

      - name: Validate stage promotion readiness
        run: python products/openclaw/scripts/gateway_release.py readiness validate

      - name: Show source environment contract
        run: cat "environments/$RELEASE_SOURCE_ENVIRONMENT/versions.yaml"

      - name: Apply digest-based promotion
        run: python products/openclaw/scripts/gateway_release.py promote "$RELEASE_SOURCE_ENVIRONMENT" "$RELEASE_TARGET_ENVIRONMENT"

      - name: Update stage lifecycle after promotion
        run: |
          if [ "$RELEASE_SUSPEND_STAGE_ENVIRONMENT" = "true" ]; then
            python products/openclaw/scripts/set_stage_environment_state.py suspend --components all
          else
            python products/openclaw/scripts/gateway_release.py verification reset --status pending --note "Prod promotion completed; re-run stage verification before the next approval."
            python products/openclaw/scripts/gateway_release.py readiness reset --status pending --note "Prod promotion completed; re-approve stage before the next promotion."
          fi

      - name: Validate target environment contract
        run: python products/openclaw/scripts/gateway_release.py validate "$RELEASE_TARGET_ENVIRONMENT"

      - name: Capture prod verification status
        id: prod_verification
        run: |
          {
            echo "status_line<<__PROD_VERIFICATION__"
            python products/openclaw/scripts/gateway_release.py prod-verification status
            echo "__PROD_VERIFICATION__"
          } >> "$GITHUB_OUTPUT"

      - name: Render promoted prod gateway chart
        run: helm template openclaw-gateway charts/openclaw-gateway -f environments/prod/values/openclaw-gateway.yaml >/tmp/openclaw-gateway-prod.yaml

      - name: Render promoted prod platform version chart
        run: helm template platform-version charts/platform-version -f environments/prod/values/platform-version.yaml >/tmp/platform-version-prod.yaml

      - name: Capture post-promotion readiness status
        id: readiness
        run: |
          {
            echo "status_line<<__READINESS__"
            python products/openclaw/scripts/gateway_release.py readiness status
            echo "__READINESS__"
          } >> "$GITHUB_OUTPUT"

      - name: Show promotion diff
        run: |
          git diff -- environments/prod/versions.yaml environments/prod/verification.yaml environments/prod/values/openclaw-gateway.yaml environments/prod/values/platform-version.yaml environments/stage/argocd/kustomization.yaml environments/stage/verification.yaml environments/stage/promotion-readiness.yaml

      - name: Capture promoted image metadata
        id: promoted
        run: |
          python - <<'PY'
          import yaml
          with open("environments/prod/versions.yaml", "r", encoding="utf-8") as fh:
              data = yaml.safe_load(fh)
          image = data["gateway"]["image"]
          source = data["sourceRepos"]
          overlay = (data.get("experiments") or {}).get("telegramOverlay") or {}
          overlay_image = overlay.get("image") or {}
          with open(__import__("os").environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"PROMOTED_IMAGE={image['repository']}@{image['digest']}\n")
              fh.write(f"PROMOTED_TAG={image['tag']}\n")
              fh.write(f"PROMOTED_TELEGRAM_SHA={source['telegramEnhanced']['commit']}\n")
              fh.write(f"PROMOTED_HOST_BRIDGE_SHA={source['hostBridge']['commit']}\n")
              fh.write(f"PROMOTED_RUNTIME_DISTRIBUTION_SHA={source['runtimeDistribution']['commit']}\n")
              fh.write(f"PROMOTED_PLATFORM_SHA={source['platformEngineering']['commit']}\n")
              fh.write(f"PROMOTED_TELEGRAM_OVERLAY_STATUS={overlay.get('status', 'inactive')}\n")
              fh.write(f"PROMOTED_TELEGRAM_OVERLAY_SOURCE_SHA={(overlay.get('source') or {}).get('commit', '') or 'disabled'}\n")
              overlay_image_ref = "disabled"
              if overlay.get("status") == "candidate" and overlay_image.get("repository") and overlay_image.get("digest"):
                  overlay_image_ref = f"{overlay_image['repository']}@{overlay_image['digest']}"
              fh.write(f"PROMOTED_TELEGRAM_OVERLAY_IMAGE={overlay_image_ref}\n")
              fh.write(f"PROMOTED_TELEGRAM_OVERLAY_QUALIFIED_BASE_IMAGE={overlay.get('qualifiedBaseImage', '') or 'disabled'}\n")
          PY

      - name: Create and push promotion branch
        id: promotion_branch
        env:
          PROMOTION_BRANCH: promote/prod-${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$PROMOTION_BRANCH"
          git add environments/prod/versions.yaml environments/prod/verification.yaml environments/prod/values/openclaw-gateway.yaml environments/prod/values/platform-version.yaml environments/stage/argocd/kustomization.yaml environments/stage/verification.yaml environments/stage/promotion-readiness.yaml
          git commit -m "Promote prod to approved stage gateway digest"
          git push origin "$PROMOTION_BRANCH"
          echo "promotion_branch=$PROMOTION_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open original source review for native request
        if: steps.promotion_branch.outcome == 'success' && inputs.console_request_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: python products/openclaw/scripts/console_release_workflow.py publish promotion

      - name: Publish owner workflow summary
        run: python products/openclaw/scripts/console_release_workflow.py summary promotion
