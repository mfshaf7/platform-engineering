openclaw_bridge_service_name: openclaw-host-bridge.service
openclaw_stage_bridge_service_name: openclaw-host-bridge-stage.service
openclaw_recovery_service_name: openclaw-host-recovery.service
openclaw_stack_target_name: openclaw-host-stack.target
platform_linux_user: "{{ lookup('env', 'PLATFORM_LINUX_USER') | default(lookup('env', 'USER'), true) | default('platform', true) }}"
platform_linux_home: "{{ lookup('env', 'PLATFORM_LINUX_HOME') | default('/home/' ~ platform_linux_user, true) }}"
platform_projects_root: "{{ lookup('env', 'PLATFORM_PROJECTS_ROOT') | default(platform_linux_home ~ '/projects', true) }}"
platform_windows_local_appdata_dir: "{{ lookup('env', 'PLATFORM_WINDOWS_LOCAL_APPDATA_DIR') | default('%LOCALAPPDATA%', true) }}"
platform_windows_bootstrap_artifact_dir: "{{ platform_windows_local_appdata_dir }}\\OpenClaw\\bootstrap"
platform_repo_root: "{{ platform_projects_root }}/platform-engineering"
openclaw_host_bridge_root: "{{ platform_projects_root }}/openclaw-host-bridge"
openclaw_bridge_user: root
openclaw_host_bridge_config_path: "{{ openclaw_host_bridge_root }}/config/policy.local.json"
openclaw_openclaw_config_path: "{{ platform_linux_home }}/.openclaw/openclaw.json"
openclaw_stage_host_bridge_config_path: "{{ openclaw_host_bridge_root }}/config/policy.stage.local.json"
openclaw_stage_openclaw_config_path: "{{ platform_linux_home }}/.openclaw-stage/openclaw.stage.k3s.json"
openclaw_host_bridge_restart_delay_seconds: 2
openclaw_host_recovery_restart_delay_seconds: 2
openclaw_host_bridge_node_bin_dir: "{{ platform_linux_home }}/.nvm/versions/node/v24.14.1/bin"
openclaw_host_bridge_pid_path: "{{ openclaw_host_bridge_root }}/tmp/openclaw-host-bridge.pid"
openclaw_host_bridge_lock_path: "{{ openclaw_host_bridge_root }}/tmp/openclaw-host-bridge.lock"
openclaw_host_bridge_log_path: "{{ openclaw_host_bridge_root }}/tmp/openclaw-host-bridge.log"
openclaw_stage_bridge_pid_path: "{{ openclaw_host_bridge_root }}/tmp/openclaw-host-bridge-stage.pid"
openclaw_stage_bridge_lock_path: "{{ openclaw_host_bridge_root }}/tmp/openclaw-host-bridge-stage.lock"
openclaw_stage_bridge_log_path: "{{ openclaw_host_bridge_root }}/tmp/openclaw-host-bridge-stage.log"
platform_windows_task_name: PlatformCoreHostStack
platform_windows_wsl_distro: Platform-Core
platform_windows_vault_unseal_enabled: true
platform_windows_vault_unseal_service_name: platform-vault-unseal.service
platform_windows_vault_unseal_timeout_seconds: 180
platform_windows_vault_tpm_certificate_store_path: Cert:\CurrentUser\My
platform_windows_vault_tpm_certificate_subject: CN=Platform Vault Unseal
platform_windows_vault_encrypted_bundle_path: "{{ platform_windows_local_appdata_dir }}\\OpenClaw\\vault\\platform-vault-init.cms"
platform_transit_mode: disabled
platform_transit_windows_wsl_distro: Platform-Transit
platform_transit_vault_service_name: vault
platform_transit_vault_health_url: http://127.0.0.1:8200/v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204
platform_transit_vault_windows_proxy_name: Platform Transit Vault 18200
platform_transit_vault_windows_proxy_port: 18200
platform_transit_vault_start_timeout_seconds: 60
platform_transit_vault_unseal_wait_timeout_seconds: 180
platform_transit_windows_unseal_enabled: false
platform_transit_windows_tpm_certificate_store_path: Cert:\CurrentUser\My
platform_transit_windows_tpm_certificate_subject: CN=Platform Transit Vault Unseal
platform_transit_windows_encrypted_bundle_path: "{{ platform_windows_local_appdata_dir }}\\OpenClaw\\transit-vault\\transit-init.cms"
platform_transit_vault_version: 1.18.4
platform_transit_vault_zip_url: https://releases.hashicorp.com/vault/{{ platform_transit_vault_version }}/vault_{{ platform_transit_vault_version }}_linux_amd64.zip
platform_transit_vault_install_root: /opt/openclaw/transit-vault
platform_transit_vault_config_dir: /etc/openclaw/transit-vault
platform_transit_vault_data_dir: /var/lib/openclaw/transit-vault
platform_transit_vault_listen_address: 0.0.0.0:8200
platform_transit_vault_cluster_address: 127.0.0.1:8201
platform_transit_vault_api_addr: http://127.0.0.1:8200
openclaw_bridge_health_url: http://127.0.0.1:48721/healthz
openclaw_stage_bridge_health_url: http://127.0.0.1:48731/healthz
openclaw_stage_gateway_bridge_url: http://172.27.88.8:48731
openclaw_recovery_health_url: http://127.0.0.1:48722/healthz
platform_vault_namespace: vault
platform_vault_pod_names:
  - vault-0
  - vault-1
  - vault-2
platform_argocd_namespace: argocd
platform_restart_validation_applications:
  - external-secrets
  - vault
  - platform-root-shared
  - platform-root-stage
  - platform-root-prod
  - platform-secrets-stage
  - platform-secrets-prod
  - openclaw-gateway
  - openclaw-observability
  - openclaw-observability-stage
platform_argocd_reconciliation_timeout_seconds: 180
platform_argocd_reconciliation_poll_interval_seconds: 5
platform_windows_localhost_forward_ports:
  - 32090
  - 32091
  - 32093
  - 32094
  - 32080
  - 32081
  - 32083
  - 32200
  - 32443
platform_windows_host_forward_rules:
  - name: PlatformCore Ollama 11434
    listen_address_source: wsl_host_docker_internal
    listen_address_aliases:
      - host.docker.internal
    listen_port: 11434
    connect_address: 127.0.0.1
    connect_port: 11434
platform_windows_ollama_health_url: http://127.0.0.1:11434/api/tags
platform_gateway_runtime_dependency_url: http://host.docker.internal:11434/api/tags
platform_gateway_runtime_dependency_namespaces:
  - openclaw
  - openclaw-stage
platform_k3s_version: v1.30.2+k3s2
platform_k3s_config_path: /etc/rancher/k3s/config.yaml
platform_k3s_kubeconfig_path: /etc/rancher/k3s/k3s.yaml
platform_k3s_kubectl_command: /usr/local/bin/k3s kubectl
platform_k3s_write_kubeconfig_mode: "0644"
platform_k3s_disable_components:
  - traefik
platform_k3s_cluster_cidr: 10.42.0.0/16
platform_k3s_service_cidr: 10.43.0.0/16
openclaw_legacy_runtime_state_dir: "{{ platform_linux_home }}/.openclaw"
openclaw_legacy_runtime_workspace: "{{ openclaw_legacy_runtime_state_dir }}/workspace"
openclaw_legacy_runtime_project_name: upstream-openclaw
openclaw_legacy_runtime_service_name: openclaw-gateway
openclaw_legacy_runtime_container_name: upstream-openclaw-openclaw-gateway-1
openclaw_legacy_runtime_image: openclaw:local
openclaw_legacy_runtime_gateway_port: 18789
openclaw_legacy_runtime_bridge_port: 18790
openclaw_legacy_windows_stack_task_name: OpenClawHostStack
openclaw_legacy_windows_bridge_task_name: OpenClawHostBridge
openclaw_legacy_windows_bridge_repo_root: "{{ openclaw_host_bridge_root }}"
