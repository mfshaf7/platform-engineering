---
- name: Render migration cutover command inventory
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../../group_vars/all/main.yml
  vars:
    openclaw_cutover_inventory_dir: "{{ playbook_dir }}/../../generated/legacy/cutover-command-inventory"
    openclaw_cutover_inventory_path: "{{ openclaw_cutover_inventory_dir }}/cutover-command-inventory.md"
  tasks:
    - name: Ensure cutover command inventory directory exists
      file:
        path: "{{ openclaw_cutover_inventory_dir }}"
        state: directory
        mode: "0755"

    - name: Render cutover command inventory
      template:
        src: ../../roles/wsl_host_stack/templates/legacy/cutover-command-inventory.md.j2
        dest: "{{ openclaw_cutover_inventory_path }}"
        mode: "0644"
