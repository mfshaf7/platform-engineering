---
- name: Verify platform host bootstrap
  hosts: wsl_hosts
  vars_files:
    - ../group_vars/all/main.yml
  vars:
    openclaw_windows_bootstrap_artifact_path: "{{ playbook_dir }}/../generated/openclaw-host-stack-windows-bootstrap.ps1"
  tasks:
    - name: Check systemd runtime state
      command: systemctl is-system-running
      register: systemd_state
      changed_when: false
      failed_when: systemd_state.rc not in [0, 1] or systemd_state.stdout not in ["running", "degraded"]

    - name: Check host stack target is enabled
      command: systemctl is-enabled {{ openclaw_stack_target_name }}
      register: host_stack_enabled
      changed_when: false

    - name: Check bridge service is enabled
      command: systemctl is-enabled {{ openclaw_bridge_service_name }}
      register: bridge_enabled
      changed_when: false

    - name: Check recovery service is enabled
      command: systemctl is-enabled {{ openclaw_recovery_service_name }}
      register: recovery_enabled
      changed_when: false

    - name: Check k3s service is enabled
      command: systemctl is-enabled k3s
      register: k3s_enabled
      changed_when: false

    - name: Check k3s service is active
      command: systemctl is-active k3s
      register: k3s_active
      changed_when: false

    - name: Check Kubernetes node access
      command: "{{ platform_k3s_kubectl_command }} get nodes"
      environment:
        KUBECONFIG: "{{ platform_k3s_kubeconfig_path }}"
      register: kubectl_nodes
      changed_when: false

    - name: Check host stack runtime status
      command: "{{ openclaw_host_bridge_root }}/scripts/status-openclaw-host-stack.sh"
      register: host_stack_status
      changed_when: false

    - name: Check bridge health endpoint
      command: curl -fsS {{ openclaw_bridge_health_url }}
      register: bridge_health
      changed_when: false

    - name: Check recovery health endpoint
      command: curl -fsS {{ openclaw_recovery_health_url }}
      register: recovery_health
      changed_when: false

    - name: Check host stack target is active
      command: systemctl is-active {{ openclaw_stack_target_name }}
      register: host_stack_active
      changed_when: false

    - name: Check bridge service is active
      command: systemctl is-active {{ openclaw_bridge_service_name }}
      register: bridge_active
      changed_when: false

    - name: Check recovery service is active
      command: systemctl is-active {{ openclaw_recovery_service_name }}
      register: recovery_active
      changed_when: false

    - name: Check Vault pods are ready
      command: >-
        {{ platform_k3s_kubectl_command }}
        -n {{ platform_vault_namespace }}
        get pods
      environment:
        KUBECONFIG: "{{ platform_k3s_kubeconfig_path }}"
      register: vault_pods
      changed_when: false

    - name: Resolve active Vault pod
      command: >-
        sh -lc '{{ platform_k3s_kubectl_command }}
        -n {{ platform_vault_namespace }}
        get pods -l vault-active=true,vault-sealed=false
        -o jsonpath='"'"'{.items[0].metadata.name}'"'"''
      environment:
        KUBECONFIG: "{{ platform_k3s_kubeconfig_path }}"
      register: active_vault_pod
      changed_when: false
      retries: 12
      delay: 5
      until:
        - active_vault_pod.rc == 0
        - (active_vault_pod.stdout | trim) != ""

    - name: Check Vault is unsealed on active pod
      command: >-
        {{ platform_k3s_kubectl_command }}
        -n {{ platform_vault_namespace }}
        exec {{ active_vault_pod.stdout | trim }} -- sh -lc 'vault status -format=json | grep -Eq "\"sealed\"[[:space:]]*:[[:space:]]*false"'
      environment:
        KUBECONFIG: "{{ platform_k3s_kubeconfig_path }}"
      register: vault_unsealed
      changed_when: false

    - name: Check core Argo applications are synced and healthy
      command: >-
        sh -lc '{{ platform_k3s_kubectl_command }}
        -n {{ platform_argocd_namespace }}
        get applications.argoproj.io {{ platform_restart_validation_applications | join(" ") }}
        -o custom-columns=NAME:.metadata.name,SYNC:.status.sync.status,HEALTH:.status.health.status
        --no-headers |
        awk '"'"'$2 != "Synced" || $3 != "Healthy" { exit 1 }'"'"''
      environment:
        KUBECONFIG: "{{ platform_k3s_kubeconfig_path }}"
      register: argocd_apps
      changed_when: false
      retries: "{{ ((platform_argocd_reconciliation_timeout_seconds | int) // (platform_argocd_reconciliation_poll_interval_seconds | int)) | int }}"
      delay: "{{ platform_argocd_reconciliation_poll_interval_seconds | int }}"
      until: argocd_apps.rc == 0

    - name: Check rendered Windows bootstrap artifact exists
      delegate_to: localhost
      become: false
      stat:
        path: "{{ openclaw_windows_bootstrap_artifact_path }}"
      register: windows_bootstrap_artifact

    - name: Fail when rendered Windows bootstrap artifact is missing
      delegate_to: localhost
      become: false
      fail:
        msg: >-
          Missing rendered Windows bootstrap artifact at
          {{ openclaw_windows_bootstrap_artifact_path }}.
          Run `make render-windows-bootstrap` before verification.
      when: not windows_bootstrap_artifact.stat.exists
