---
- name: Ensure base packages are present for cluster bootstrap
  package:
    name:
      - curl
      - ca-certificates
      - gnupg
    state: present

- name: Ensure k3s config directory exists
  file:
    path: /etc/rancher/k3s
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install k3s config
  template:
    src: k3s-config.yaml.j2
    dest: "{{ platform_k3s_config_path }}"
    owner: root
    group: root
    mode: "0644"

- name: Check whether k3s is installed
  stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Install k3s server
  shell: |
    curl -sfL https://get.k3s.io | \
      INSTALL_K3S_VERSION="{{ platform_k3s_version }}" \
      sh -s - server
  args:
    executable: /bin/bash
  when: not k3s_binary.stat.exists

- name: Ensure k3s service is enabled and running
  systemd:
    name: k3s
    enabled: true
    state: started

- name: Wait for kubeconfig to exist
  wait_for:
    path: /etc/rancher/k3s/k3s.yaml
    timeout: 120

- name: Wait for node to become ready
  command: "{{ platform_k3s_kubectl_command }} get nodes"
  register: kubectl_nodes
  changed_when: false
  retries: 20
  delay: 6
  until: kubectl_nodes.rc == 0
