---
- name: Ensure base packages are present for WSL host bootstrap
  package:
    name: "{{ openclaw_wsl_required_packages }}"
    state: present

- name: Ensure runtime directories exist
  file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/openclaw
    - /etc/openclaw/host-bridge
    - /etc/systemd/system

- name: Install WSL systemd configuration
  template:
    src: wsl.conf.j2
    dest: "{{ openclaw_wsl_config_path }}"
    owner: root
    group: root
    mode: "0644"

- name: Check required host-bridge runtime paths
  stat:
    path: "{{ item }}"
  loop: "{{ openclaw_host_bridge_required_paths }}"
  register: openclaw_host_bridge_paths

- name: Fail when required host-bridge runtime paths are missing
  fail:
    msg: >-
      Missing required host runtime path: {{ item.item }}.
      Clone or sync the canonical openclaw-host-bridge checkout into
      {{ openclaw_host_bridge_root }} before provisioning the WSL host stack.
  loop: "{{ openclaw_host_bridge_paths.results }}"
  when: not item.stat.exists

- name: Check required local runtime inputs
  stat:
    path: "{{ item }}"
  loop: "{{ openclaw_host_runtime_required_paths }}"
  register: openclaw_host_runtime_inputs

- name: Fail when required local runtime inputs are missing
  fail:
    msg: >-
      Missing required local runtime input: {{ item.item }}.
      Create the local host configuration files and install the configured Node
      runtime before provisioning the WSL host stack.
  loop: "{{ openclaw_host_runtime_inputs.results }}"
  when: not item.stat.exists

- name: Check generated Windows Vault unseal helper
  stat:
    path: "{{ platform_windows_vault_unseal_artifact_linux_path }}"
  register: platform_windows_vault_unseal_helper
  when: platform_windows_vault_unseal_enabled | bool

- name: Fail when generated Windows Vault unseal helper is missing
  fail:
    msg: >-
      Missing generated Windows Vault unseal helper at
      {{ platform_windows_vault_unseal_artifact_linux_path }}.
      Run `make render-windows-bootstrap` before provisioning the WSL host stack
      when unattended Vault recovery is enabled.
  when:
    - platform_windows_vault_unseal_enabled | bool
    - not platform_windows_vault_unseal_helper.stat.exists

- name: Install prod bridge environment file
  template:
    src: openclaw-host-bridge.env.j2
    dest: /etc/openclaw/host-bridge/openclaw-host-bridge.env
    owner: root
    group: root
    mode: "0644"
  vars:
    bridge_env_file_path: /etc/openclaw/host-bridge/openclaw-host-bridge.env
    bridge_config_path: "{{ openclaw_host_bridge_config_path }}"
    openclaw_config_path: "{{ openclaw_openclaw_config_path }}"
    bridge_pid_path: "{{ openclaw_host_bridge_pid_path }}"
    bridge_lock_path: "{{ openclaw_host_bridge_lock_path }}"
    bridge_log_path: "{{ openclaw_host_bridge_log_path }}"

- name: Install stage bridge environment file
  template:
    src: openclaw-host-bridge.env.j2
    dest: /etc/openclaw/host-bridge/openclaw-host-bridge-stage.env
    owner: root
    group: root
    mode: "0644"
  vars:
    bridge_env_file_path: /etc/openclaw/host-bridge/openclaw-host-bridge-stage.env
    bridge_config_path: "{{ openclaw_stage_host_bridge_config_path }}"
    openclaw_config_path: "{{ openclaw_stage_openclaw_config_path }}"
    bridge_pid_path: "{{ openclaw_stage_bridge_pid_path }}"
    bridge_lock_path: "{{ openclaw_stage_bridge_lock_path }}"
    bridge_log_path: "{{ openclaw_stage_bridge_log_path }}"

- name: Install prod bridge service unit
  template:
    src: openclaw-host-bridge.service.j2
    dest: "/etc/systemd/system/{{ openclaw_bridge_service_name }}"
    owner: root
    group: root
    mode: "0644"
  vars:
    bridge_env_file_path: /etc/openclaw/host-bridge/openclaw-host-bridge.env
    bridge_wanted_by: "{{ openclaw_stack_target_name }}"

- name: Install stage bridge service unit
  template:
    src: openclaw-host-bridge.service.j2
    dest: "/etc/systemd/system/{{ openclaw_stage_bridge_service_name }}"
    owner: root
    group: root
    mode: "0644"
  vars:
    bridge_env_file_path: /etc/openclaw/host-bridge/openclaw-host-bridge-stage.env
    bridge_wanted_by: multi-user.target

- name: Install recovery service unit
  template:
    src: openclaw-host-recovery.service.j2
    dest: "/etc/systemd/system/{{ openclaw_recovery_service_name }}"
    owner: root
    group: root
    mode: "0644"

- name: Install stack target unit
  template:
    src: openclaw-host-stack.target.j2
    dest: "/etc/systemd/system/{{ openclaw_stack_target_name }}"
    owner: root
    group: root
    mode: "0644"

- name: Install WSL Vault unseal wrapper
  template:
    src: platform-vault-unseal-from-wsl.sh.j2
    dest: "{{ platform_windows_vault_unseal_wsl_wrapper_path }}"
    owner: root
    group: root
    mode: "0755"
  when: platform_windows_vault_unseal_enabled | bool

- name: Install WSL Vault unseal service unit
  template:
    src: platform-vault-unseal.service.j2
    dest: "/etc/systemd/system/{{ platform_windows_vault_unseal_service_name }}"
    owner: root
    group: root
    mode: "0644"
  when: platform_windows_vault_unseal_enabled | bool

- name: Reload systemd
  systemd:
    daemon_reload: true

- name: Enable bridge service
  systemd:
    name: "{{ openclaw_bridge_service_name }}"
    enabled: true

- name: Disable stage bridge service by default
  systemd:
    name: "{{ openclaw_stage_bridge_service_name }}"
    enabled: false

- name: Enable recovery service
  systemd:
    name: "{{ openclaw_recovery_service_name }}"
    enabled: true

- name: Enable stack target
  systemd:
    name: "{{ openclaw_stack_target_name }}"
    enabled: true

- name: Enable WSL Vault unseal service
  systemd:
    name: "{{ platform_windows_vault_unseal_service_name }}"
    enabled: true
  when: platform_windows_vault_unseal_enabled | bool
