apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-root-stage
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mfshaf7/platform-engineering.git
    targetRevision: main
    path: environments/stage/argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
