apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openclaw-root
  namespace: argocd
spec:
  project: openclaw-platform
  source:
    repoURL: https://github.com/mfshaf7/platform-engineering.git
    targetRevision: main
    path: environments/prod/argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
