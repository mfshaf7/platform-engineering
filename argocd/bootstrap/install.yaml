apiVersion: v1
kind: Namespace
metadata:
  name: argocd
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-bootstrap-notes
  namespace: argocd
data:
  README: |
    Install Argo CD using the upstream manifest or Helm chart, then apply
    argocd/bootstrap/operator-access.yaml to expose the Argo UI on a stable
    NodePort, then apply argocd/apps/root.yaml to register the platform root
    application.
