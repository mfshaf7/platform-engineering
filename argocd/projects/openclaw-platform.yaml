apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: openclaw-platform
  namespace: argocd
spec:
  description: OpenClaw platform workloads and supporting services
  sourceRepos:
    - https://github.com/mfshaf7/platform-engineering.git
    - oci://ghcr.io/prometheus-community/charts
    - https://charts.external-secrets.io
  destinations:
    - namespace: openclaw
      server: https://kubernetes.default.svc
    - namespace: observability
      server: https://kubernetes.default.svc
    - namespace: external-secrets
      server: https://kubernetes.default.svc
    - namespace: argocd
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
