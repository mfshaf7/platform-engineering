apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openclaw-gateway.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "openclaw-gateway.name" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: {{ .Values.strategy.type }}
    {{- if and (eq .Values.strategy.type "RollingUpdate") .Values.strategy.rollingUpdate }}
    rollingUpdate:
      {{- toYaml .Values.strategy.rollingUpdate | nindent 6 }}
    {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "openclaw-gateway.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "openclaw-gateway.name" . }}
      annotations:
        openclaw.io/telegram-sha: {{ .Values.env.OPENCLAW_TELEGRAM_SHA | quote }}
        openclaw.io/host-bridge-sha: {{ .Values.env.OPENCLAW_HOST_BRIDGE_SHA | quote }}
        openclaw.io/platform-sha: {{ .Values.env.OPENCLAW_PLATFORM_SHA | quote }}
    spec:
      hostNetwork: {{ .Values.hostNetwork }}
      dnsPolicy: {{ .Values.dnsPolicy }}
      enableServiceLinks: {{ .Values.enableServiceLinks }}
      containers:
        - name: gateway
          image: {{ include "openclaw-gateway.imageRef" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            - name: OPENCLAW_ENV
              value: {{ .Values.env.OPENCLAW_ENV | quote }}
            - name: OPENCLAW_TELEGRAM_SHA
              value: {{ .Values.env.OPENCLAW_TELEGRAM_SHA | quote }}
            - name: OPENCLAW_HOST_BRIDGE_SHA
              value: {{ .Values.env.OPENCLAW_HOST_BRIDGE_SHA | quote }}
            - name: OPENCLAW_PLATFORM_SHA
              value: {{ .Values.env.OPENCLAW_PLATFORM_SHA | quote }}
            {{- range .Values.extraEnv }}
            - name: {{ .name }}
              {{- if hasKey . "value" }}
              value: {{ .value | quote }}
              {{- end }}
            {{- end }}
          envFrom:
            {{- range .Values.secretRefs }}
            - secretRef:
                name: {{ .name }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.extraVolumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.extraVolumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
