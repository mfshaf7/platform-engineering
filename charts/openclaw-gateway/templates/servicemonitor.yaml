{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "openclaw-gateway.fullname" . }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "openclaw-gateway.name" . }}
  endpoints:
    - port: http
      interval: {{ .Values.serviceMonitor.interval }}
{{- end }}
