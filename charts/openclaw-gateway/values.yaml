namespaceOverride: ""

image:
  repository: ghcr.io/example/openclaw-gateway
  tag: "0.0.1-dev"
  digest: ""
  pullPolicy: IfNotPresent

replicaCount: 1

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 25%

hostNetwork: false
dnsPolicy: ClusterFirst

enableServiceLinks: true

command: []
args: []

service:
  type: ClusterIP
  port: 18789

env:
  OPENCLAW_ENV: prod
  OPENCLAW_TELEGRAM_SHA: replace-me
  OPENCLAW_HOST_BRIDGE_SHA: replace-me
  OPENCLAW_PLATFORM_SHA: replace-me

extraEnv: []

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

extraVolumeMounts: []
extraVolumes: []

serviceMonitor:
  enabled: true
  interval: 30s

prepull:
  enabled: false
  syncWave: -1
  ttlSecondsAfterFinished: 300
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 50m
      memory: 128Mi

secretRefs:
  - name: openclaw-gateway-secrets
