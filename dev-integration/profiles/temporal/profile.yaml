schema_version: 1
profile_id: temporal
lane_class: governed-devint
summary: Proposed persistent local-k3s profile for the platform-owned Temporal runtime behind OOS.
runtime:
  platform: local-k3s
  state_model: persistent
  namespace_pattern: devint-{profile}-{operator}
  state_root_template: .dev-integration/{profile}/{operator}
  components:
    - temporal-server
    - temporal-ui
    - temporal-postgresql
persistence:
  justification: Durable workflow history must survive normal process and local runtime restarts so waits, retries, and reconciliation can resume safely.
  retained_data_scope: Operator-scoped workflow histories, runtime metadata, and reference-only search attributes for local dev-integration proof.
  suspend_resume_semantics: Normal down suspends runtime processes while preserving PostgreSQL and workflow history; up reconciles and resumes the same operator-scoped state.
  storage_size_or_class: Requested 10Gi local-path PostgreSQL storage for the first local-k3s implementation; build admission must confirm the final class and capacity.
  reset_semantics: Reset is an explicit destructive action that may remove only the operator-scoped Temporal namespace and local profile state after confirmation.
  cutover_plan_when_upgrading: Not applicable to the first profile; any future state-model or storage migration requires a recorded export, compatibility, restore, and rollback plan.
testing:
  smoke:
    mutation_mode: read-only
source_repos:
  - repo: platform-engineering
    purpose: Temporal runtime profile, persistence, access, operations, observability, and release posture.
  - repo: operator-orchestration-service
    purpose: Aggregate workflow definitions, Temporal adapter, workers, run-control API, projection, and final receipts.
  - repo: workspace-governance
    purpose: Durable-orchestration authority, qualification, admission, and profile lifecycle contracts.
  - repo: workspace-governance-control-fabric
    purpose: Bounded governance validation and readiness activities for the initial safe runtime proof.
  - repo: security-architecture
    purpose: Identity, task-queue, secret, persistence, network, payload, and runtime security review.
commands:
  up: dev-integration/profiles/temporal/scripts/up.sh
  status: dev-integration/profiles/temporal/scripts/status.sh
  access: dev-integration/profiles/temporal/scripts/access.sh
  smoke: dev-integration/profiles/temporal/scripts/smoke.sh
  down: dev-integration/profiles/temporal/scripts/down.sh
  reset: dev-integration/profiles/temporal/scripts/reset.sh
  promote_check: dev-integration/profiles/temporal/scripts/promote-check.sh
session:
  required_artifacts:
    - profile-status.txt
    - smoke-summary.json
    - profile-promotion-notes.md
    - promotion-report.yaml
stage_handoff:
  owner_repo: platform-engineering
  governed_surface: temporal-stage
  required_checks:
    - active dev-integration profile admission
    - OOS Temporal adapter and workflow definition contract
    - namespace and task queue identity boundary
    - PostgreSQL persistence migration backup and restore
    - worker and runtime restart replay proof
    - workflow and activity idempotency retry timeout and cancellation
    - observability retention and payload redaction
    - current security acceptance
    - source projection rollback and suspension proof
