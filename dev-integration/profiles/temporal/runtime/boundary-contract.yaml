schema_version: 1
runtime:
  kubernetes_namespace_source: dev-integration-session
  temporal_namespace_pattern: governance-{operator}
  temporal_namespace_max_length: 46
  temporal_namespace_derived_name_pattern: create-{namespace}-namespace
  operator_namespace_encoding: dns-label-with-sha256-suffix-on-lossy-normalization
  local_only: true
  public_ingress: false
  direct_console_access: false
  diagnostic_access: operator-local-port-forward
  persistence:
    storage_class: local-path
    size: 10Gi
    normal_down_preserves_history: true
    reset_requires_confirmation: true
  controlled_commissioning:
    source_posture: source-reviewed-non-live
    ordinary_profile_launch_allowed: false
    operator_scope_encoding: dns-label-with-sha256-suffix-on-lossy-normalization
    state_root_pattern: .dev-integration/temporal/{collision-resistant-operator-scope}
    security_authorization:
      owner_repo: security-architecture
      excluded_from_execution_source_claims: true
      provenance: exact-json-at-clean-permit-bound-git-revision
      merged_source_ref: refs/remotes/origin/main
      approval_envelope_bindings:
        - source-revision
        - normalized-source-path
        - artifact-reference
        - artifact-digest
      self_declared_role_allowed: false
    runtime_action_gate:
      revalidate_before_every_shell-mutation: true
      terminal_cleanup:
        actions:
          - restore-baseline
          - cleanup
        current-checkout-drift-allowed: true
        executor_source: sealed-attested-permit-bound-platform-profile
        permit-bound-historical-security-artifact-required: true
        new-proof-mutations-allowed: false
        restore_verification_scope: operator-scoped-runtime-surfaces-only
        source-checkout-restoration-required: false
      execution_scope_lease:
        key: collision-resistant-operator-scope
        acquisition: atomic-before-execution-claim
        matching-interrupted-claim-resume-allowed: true
        cross-authorization-sharing-allowed: false
        release: after-successful-scoped-baseline-verification
      execution_setup_transaction:
        lock: per-authorization-local-filesystem-lock
        owner-context-persistence: idempotent-before-claim
        exact-active-claim-resume: same-output-root-and-scope-lease-only
        concurrent-exact-resume: denied
      executor_source_integrity:
        scope: complete-temporal-profile-tree
        evidence: permit-bound-commit-blob-bytes
        git-index-state-trusted: false
        additional-files-allowed: false
        mutable-checkout-path-execution-allowed: false
        sealed-source: linux-memfd
        execution-projection: private-read-only-profile-tree
        sandbox: bubblewrap
        unprivileged-user-namespace-required: true
      snapshot_transaction:
        lock: per-authorization-local-filesystem-lock
        receipt-resume: exact-matching-uncommitted-snapshot-only
        commit_marker: run.yaml
        recovery-after-execution-claim: denied
      required_bindings:
        - authorization-and-digest
        - operator-approval
        - source-controlled-security-authorization
        - baseline-and-evidence-root
        - canonical-single-use-consumption-receipt-and-digest
        - canonical-execution-claim-and-digest
        - canonical-operator-scope-lease-and-digest
        - canonical-output-root
        - exact-kubernetes-namespace
        - exact-temporal-namespace
        - collision-resistant-state-root
identities:
  temporal_runtime:
    owner_repo: platform-engineering
    service_account: temporal-runtime
    credential_scope: runtime-only
  temporal_postgresql:
    owner_repo: platform-engineering
    service_account: temporal-postgresql
    credential_scope: database-only
  oos_api:
    owner_repo: operator-orchestration-service
    service_account: temporal-oos-api
    pod_label: orchestration.workspace/identity=oos-api
    credential_scope: permit-bound-workflow-start-and-run-control
  oos_workflow_worker:
    owner_repo: operator-orchestration-service
    service_account: temporal-oos-worker
    pod_label: orchestration.workspace/identity=oos-workflow-worker
    credential_scope: workflow-definition-and-run-control
  wgcf_activity_worker:
    owner_repo: workspace-governance-control-fabric
    service_account: temporal-wgcf-activity
    pod_label: orchestration.workspace/identity=wgcf-activity-worker
    credential_scope: bounded-validation-readiness-activities
  human_diagnostic:
    owner_repo: platform-engineering
    service_account: temporal-diagnostic
    credential_scope: operator-local-read-only
database_identities:
  postgresql_administration:
    secret_name: temporal-postgresql
    username_key: admin_username
    password_key: admin_password
    credential_scope: bootstrap-backup-restore
    exposed_to_temporal_server: false
  temporal_application:
    secret_name: temporal-postgresql
    username_key: username
    password_key: password
    credential_scope: temporal-and-visibility-databases
    superuser: false
workflow_profiles:
  - profile_id: delivery-refinement-apply-v1
    status: selected-not-active
    definition:
      id: delivery.refinement.apply
      version: 1
      owner_repo: operator-orchestration-service
      contract_ref: contracts/refinement/manifest.json
    runtime_binding:
      profile_id: temporal
      workflow_task_queue_id: delivery-refinement-apply
      activity_task_queue_id: delivery-refinement-activity
      worker_identity: oos_workflow_worker
    authority:
      console_direct_access_allowed: false
      consumer_temporal_credentials_allowed: false
      platform_business_logic_allowed: false
    activation:
      worker_start_allowed: false
      security_acceptance_ref: openproject://work_packages/1012
      platform_activation_ref: openproject://work_packages/1013
task_queues:
  - id: validation-readiness-run
    name_prefix: oos.validation-readiness-run.v1
    kind: workflow
    owner_repo: operator-orchestration-service
    worker_identity: oos_workflow_worker
    generation:
      source: activation-evidence-manifest-digest
      suffix_encoding: sha256-hex
      active_restart_reuses_generation: true
      revoked_digest_reuse_allowed: false
      fresh_activation:
        initial_activation_requires_retirement_receipt: false
        prior_generation_retirement_receipt_required: true
        prior_digest_must_differ: true
  - id: validation-readiness-activity
    name: wgcf.validation-readiness.v1
    kind: activity
    owner_repo: workspace-governance-control-fabric
    worker_identity: wgcf_activity_worker
  - id: generation-start-registry
    name_prefix: oos.generation-start-registry.v1
    kind: workflow
    owner_repo: operator-orchestration-service
    worker_identity: oos_workflow_worker
    generation:
      source: activation-evidence-manifest-digest
      suffix_encoding: sha256-hex
      polling_mode: continuous-with-business-worker
  - id: delivery-refinement-apply
    name: oos.delivery-refinement-apply.v1
    kind: workflow
    owner_repo: operator-orchestration-service
    worker_identity: oos_workflow_worker
  - id: delivery-refinement-activity
    name: delivery.refinement-apply.v1
    kind: activity
    owner_repo: operator-orchestration-service
    worker_identity: oos_workflow_worker
queue_policy:
  activity_queue_pattern: "{owner}.{activity-set}.v{major}"
  generated_workflow_queue_pattern: "{name-prefix}.{activation-manifest-digest-hex}"
  shared_worker_credentials_allowed: false
  cross_owner_consumption_allowed: false
  platform_owns_queue_business_logic: false
  enforcement:
    network_policy: restricts frontend reachability to admitted worker identities
    worker_registration: each owner registers only its declared queues
    activation_gate: runtime denial proof and fresh security acceptance
generation_retirement:
  owner_repo: platform-engineering
  applies_to_queue: validation-readiness-run
  unexpected_revocation:
    ordinary_worker_behavior: immediate-fail-stop-unfenced
    automatic_retirement_claim_allowed: false
  manifest:
    issuer: platform-engineering
    schema_owner_repo: operator-orchestration-service
    schema_ref: contracts/orchestration/generation-retirement-manifest.schema.json
    digest_pin_required: true
    bounded_lifetime_required: true
    maximum_lifetime_seconds: 900
    activation_manifest_binding_required: true
    generated_queue_binding_required: true
    start_registry_binding_required: true
    receipt_verifier_binding_required: true
    sealed_registry_resume_requires_exact_seal_authorization: true
  preconditions:
    start_ingress:
      required_state: drained
      active_replicas: 0
      in_flight_starts: 0
      maximum_observation_age_seconds: 300
      observation_age_reference: one-shot-worker-start
      evidence_ref_required: true
    ordinary_workflow_poller:
      required_state: drained
      active_replicas: 0
      maximum_observation_age_seconds: 300
      observation_age_reference: one-shot-worker-start
      evidence_ref_required: true
  start_registry:
    owner_repo: operator-orchestration-service
    workflow_type: generationStartRegistryV1
    workflow_id_pattern: "oos:generation-start-registry:v1:{activation-manifest-digest-hex}"
    task_queue_pattern: "oos.generation-start-registry.v1.{activation-manifest-digest-hex}"
    register_before_business_start_required: true
    registration_mechanism: temporal-update-with-start
    registration_update_id_scheme: business-workflow-id-prefixed-v1
    registration_update_id_pattern: "oos:generation-start-registration:v1:{business-workflow-id}"
    workflow_enforces_registration_update_id: true
    duplicate_registration_adds_history_event: false
    maximum_registration_count: 512
    capacity_exhaustion_http_status: 409
    capacity_exhaustion_api_error: orchestration_generation_capacity_exhausted
    capacity_exhaustion_required_action: retire-and-activate-fresh-generation
    rejected_update_recorded_in_history: false
    continuous_registry_poller_required: true
    seal_after_start_ingress_drain_required: true
    seal_mechanism: temporal-update-with-start
    seal_update_id_pattern: "oos:generation-start-registry-seal:v1:{retirement-evidence-digest-hex}"
    workflow_enforces_seal_update_id: true
    rejected_seal_update_recorded_in_history: false
    seal_rejection_status: seal-not-authorized
    seal_authorization_lifetime_in_payload_required: true
    seal_handler_validates_authorization_before_mutation: true
    expired_seal_closes_registry: false
    exact_workflow_id_reconciliation_required: true
    invalid_registration_count_allowed: 0
    visibility_authoritative_for_retirement: false
  one_shot_worker:
    owner_repo: operator-orchestration-service
    registry_seal_before_reconciliation_required: true
    cancellation_before_polling_required: true
    terminal_projection_verification_required: true
    authorization_recheck:
      - immediately-before-registry-worker-run
      - immediately-before-registry-seal
      - immediately-before-business-worker-run
  receipt:
    schema_owner_repo: operator-orchestration-service
    schema_ref: contracts/orchestration/generation-retirement-receipt.schema.json
    accepted_outcome: retired
    exact_registry_reconciliation_required: true
    registry_result_digest_required: true
    registry_seal_ref_binding_required: true
    registry_seal_authorization_digest_required: true
    attestation:
      algorithm: Ed25519
      canonicalization: oos-canonical-json-v1
      issuer: operator-orchestration-service
      signed_content: receipt-without-attestation
      canonical_value_domain: printable-ascii-safe-integer-json
      object_key_order: ascending-ascii
      array_order: preserved
      whitespace: none
      byte_encoding: utf-8
      payload_digest: sha256
      signature_encoding: base64
      conformance_vector_ref: dev-integration/profiles/temporal/runtime/generation-retirement-canonicalization-v1.vector.json
      manifest_pins_key_id_and_public_key_digest: true
      private_key_owner_repo: operator-orchestration-service
      verified_before_fresh_activation: true
    start_timestamp_required: true
    future_recorded_at_allowed: false
    required_before_fresh_activation: true
    retained_with_platform_evidence: true
secret_references:
  postgresql:
    secret_name: temporal-postgresql
    keys:
      - admin_username
      - admin_password
      - username
      - password
    rotation: regenerate only through an explicit reset after backup
  worker_credentials:
    source: owner-scoped-local-secret
    rotation_owned_by: each-worker-owner
    shared_long_lived_credential_allowed: false
payload_policy:
  allowed_fields:
    - source_ref
    - source_version
    - definition_id
    - definition_version
    - run_id
    - correlation_id
    - causation_id
    - bounded_decision
    - status_code
    - artifact_digest
    - receipt_ref
  denied_content:
    - secret-values
    - raw-operational-context
    - raw-cgg-artifacts
    - unbounded-logs
    - command-output
    - duplicated-business-records
    - raw-prompts
    - unconstrained-model-output
visibility:
  retirement_authority: diagnostics-only
  search_attribute_allowlist:
    - CorrelationId
    - CausationId
    - DefinitionId
    - DefinitionVersion
    - SourceRef
    - ReceiptRef
    - StatusCode
    - ArtifactDigest
  workflow_history_retention: 7d
observability:
  metrics:
    enabled: true
    payload_bodies_allowed: false
  logs:
    level: info
    payload_bodies_allowed: false
  traces:
    runtime_export_enabled: false
    correlation_owned_by: operator-orchestration-service
    payload_bodies_allowed: false
  evidence_fields:
    - request_ref
    - run_id
    - definition_id
    - workflow_id
    - activity_id
    - attempt
    - idempotency_key
    - caller_id
    - worker_id
    - operator_id
    - source_ref
    - receipt_ref
denied_paths:
  - governance-console-to-temporal
  - public-temporal-ui
  - anonymous-temporal-namespace
  - cross-owner-task-queue-consumption
  - temporal-to-canonical-backend-general-credential
