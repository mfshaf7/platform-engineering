apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openclaw-observability
  namespace: argocd
spec:
  project: platform-core
  source:
    repoURL: oci://ghcr.io/prometheus-community/charts/kube-prometheus-stack
    chart: kube-prometheus-stack
    targetRevision: 58.2.2
    helm:
      values: |
        grafana:
          enabled: true
          defaultDashboardsEnabled: true
          admin:
            existingSecret: grafana-admin-credentials
            userKey: admin-user
            passwordKey: admin-password
          grafana.ini:
            dashboards:
              default_home_dashboard_path: /tmp/dashboards/platform-overview.json
          service:
            type: NodePort
            nodePort: 32080
        prometheus:
          prometheusSpec:
            retention: 10d
        additionalPrometheusRulesMap:
          platform-baseline:
            groups:
              - name: platform-baseline
                rules:
                  - record: platform:argocd_apps_out_of_sync:count
                    expr: count(argocd_app_info{sync_status!="Synced"})
                    labels:
                      layer: platform-baseline
                      component: argocd
                      owner: platform-engineering
                      lane: prod
                      product: shared
                  - record: platform:argocd_apps_unhealthy:count
                    expr: count(argocd_app_info{health_status!="Healthy"})
                    labels:
                      layer: platform-baseline
                      component: argocd
                      owner: platform-engineering
                      lane: prod
                      product: shared
                  - record: platform:vault_ready_replicas:count
                    expr: kube_statefulset_status_replicas_ready{namespace="vault",statefulset="vault"}
                    labels:
                      layer: platform-baseline
                      component: vault
                      owner: platform-engineering
                      lane: prod
                      product: shared
                  - record: platform:platform_secrets_unhealthy:count
                    expr: count(argocd_app_info{name=~"platform-secrets-stage|platform-secrets-prod",health_status!="Healthy"})
                    labels:
                      layer: platform-baseline
                      component: platform-secrets
                      owner: platform-engineering
                      lane: prod
                      product: shared
                  - record: platform:observability_apps_unhealthy:count
                    expr: count(argocd_app_info{name=~"openclaw-observability|openclaw-observability-stage",health_status!="Healthy"})
                    labels:
                      layer: platform-baseline
                      component: observability
                      owner: platform-engineering
                      lane: prod
                      product: shared
                  - record: platform:platform_dashboards_out_of_sync:count
                    expr: count(argocd_app_info{name=~"platform-dashboards-prod|platform-dashboards-stage",sync_status!="Synced"})
                    labels:
                      layer: platform-baseline
                      component: platform-dashboards
                      owner: platform-engineering
                      lane: prod
                      product: shared
                  - record: platform:healthy_scrape_targets:ratio
                    expr: avg(up == 1)
                    labels:
                      layer: platform-baseline
                      component: observability
                      owner: platform-engineering
                      lane: prod
                      product: shared
                  - record: platform:running_cluster_pods:count
                    expr: count(kube_pod_status_phase{phase="Running"} == 1)
                    labels:
                      layer: platform-baseline
                      component: cluster-runtime
                      owner: platform-engineering
                      lane: prod
                      product: shared
                  - alert: PlatformBaselineApplicationsOutOfSync
                    expr: count(argocd_app_info{name=~"platform-root-shared|platform-root-prod|vault|platform-secrets-prod|openclaw-observability|platform-dashboards-prod",sync_status!="Synced"}) > 0
                    for: 10m
                    labels:
                      severity: warning
                      layer: platform-baseline
                      component: argocd
                      owner: platform-engineering
                      lane: prod
                      product: shared
                    annotations:
                      summary: Production platform baseline applications are out of sync
                      description: One or more production baseline applications have remained out of sync for 10 minutes.
                  - alert: PlatformBaselineApplicationsUnhealthy
                    expr: count(argocd_app_info{name=~"platform-root-shared|platform-root-prod|vault|platform-secrets-prod|openclaw-observability|platform-dashboards-prod",health_status!="Healthy"}) > 0
                    for: 5m
                    labels:
                      severity: critical
                      layer: platform-baseline
                      component: argocd
                      owner: platform-engineering
                      lane: prod
                      product: shared
                    annotations:
                      summary: Production platform baseline applications are unhealthy
                      description: One or more production baseline applications are reporting unhealthy state.
                  - alert: VaultClusterUnavailable
                    expr: kube_statefulset_status_replicas_ready{namespace="vault",statefulset="vault"} < kube_statefulset_replicas{namespace="vault",statefulset="vault"}
                    for: 5m
                    labels:
                      severity: critical
                      layer: platform-baseline
                      component: vault
                      owner: platform-engineering
                      lane: prod
                      product: shared
                    annotations:
                      summary: Vault cluster has unavailable replicas
                      description: One or more Vault replicas are not ready.
                  - alert: PlatformSecretsDeliveryUnhealthy
                    expr: count(argocd_app_info{name="platform-secrets-prod",health_status!="Healthy"}) > 0
                    for: 5m
                    labels:
                      severity: critical
                      layer: platform-baseline
                      component: platform-secrets
                      owner: platform-engineering
                      lane: prod
                      product: shared
                    annotations:
                      summary: Production platform secret delivery is unhealthy
                      description: The production platform secrets application is unhealthy, indicating ESO sync or store issues.
                  - alert: ObservabilityBaselineUnhealthy
                    expr: count(argocd_app_info{name="openclaw-observability",health_status!="Healthy"}) > 0
                    for: 5m
                    labels:
                      severity: critical
                      layer: platform-baseline
                      component: observability
                      owner: platform-engineering
                      lane: prod
                      product: shared
                    annotations:
                      summary: Production observability baseline is unhealthy
                      description: The production observability application is unhealthy.
                  - alert: PlatformDashboardsOutOfSync
                    expr: count(argocd_app_info{name="platform-dashboards-prod",sync_status!="Synced"}) > 0
                    for: 10m
                    labels:
                      severity: warning
                      layer: platform-baseline
                      component: platform-dashboards
                      owner: platform-engineering
                      lane: prod
                      product: shared
                    annotations:
                      summary: Production platform dashboard assets are out of sync
                      description: The production platform dashboard asset application has remained out of sync for 10 minutes.
        alertmanager:
          enabled: true
        nodeExporter:
          enabled: false
        prometheus-node-exporter:
          hostRootFsMount:
            enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
