apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-secrets-prod
  namespace: argocd
spec:
  project: platform-core
  source:
    repoURL: https://github.com/mfshaf7/platform-engineering.git
    targetRevision: main
    path: environments/prod/secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: openclaw
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
