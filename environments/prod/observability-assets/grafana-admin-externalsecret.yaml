apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-admin-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: platform-vault
  target:
    name: grafana-admin-credentials
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: platform/observability/prod/grafana-admin
        property: admin-user
    - secretKey: admin-password
      remoteRef:
        key: platform/observability/prod/grafana-admin
        property: admin-password
