apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: openproject-admin-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: platform-vault
  target:
    name: openproject-admin-secret
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: products/openproject/prod/admin
        property: password
