apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: openproject-postgresql-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: platform-vault
  target:
    name: openproject-postgresql-credentials
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: platform/postgresql/prod/openproject
        property: password
