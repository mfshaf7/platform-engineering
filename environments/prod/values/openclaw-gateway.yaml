image:
  repository: ghcr.io/mfshaf7/openclaw-gateway
  tag: stage-aa356db1a5b4
  digest: sha256:adee7c78f1f8be206272bacf6fd6251e7c736364a83b44c272b493329c2bcfbb
command:
- node
- dist/index.js
- gateway
- --bind
- lan
- --port
- '18789'
env:
  OPENCLAW_ENV: prod
  OPENCLAW_TELEGRAM_SHA: 642526faf216723556be830ac7308e4325de554f
  OPENCLAW_HOST_BRIDGE_SHA: a6f6d146fd91aa0f01d5ded4d768639f3a839b3e
  OPENCLAW_PLATFORM_SHA: bb9b31cc13f2428a848cf6261a4cfacff21e05bb
extraEnv:
- name: OPENCLAW_CONFIG_PATH
  value: /home/node/.openclaw/openclaw.k3s.json
- name: TERM
  value: xterm-256color
- name: TZ
  value: UTC
- name: CLAUDE_WEB_SESSION_KEY
  value: ''
- name: CLAUDE_WEB_COOKIE
  value: ''
- name: CLAUDE_AI_SESSION_KEY
  value: ''
- name: OPENCLAW_ALLOW_INSECURE_PRIVATE_WS
  value: ''
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: '2'
    memory: 4Gi
extraVolumeMounts:
- name: openclaw-home
  mountPath: /home/node/.openclaw
extraVolumes:
- name: openclaw-home
  hostPath:
    path: /home/mfshaf7/.openclaw
    type: Directory
serviceMonitor:
  enabled: true
  interval: 30s
