image:
  repository: ghcr.io/mfshaf7/openclaw-gateway
  tag: prod-2e7c8a5ab5a0
  digest: sha256:44cacdc54f7e52b21b9c0b41281a6f8315ce64c5ac00f7c1121c408ac0d23e4d

command:
  - node
  - dist/index.js
  - gateway
  - --bind
  - lan
  - --port
  - "18789"

env:
  OPENCLAW_ENV: prod
  OPENCLAW_TELEGRAM_SHA: 93f2ea6677e54dd44bce00dfe186ce4b14c7ed77
  OPENCLAW_HOST_BRIDGE_SHA: 12ed13cb076689c1874b3710342a29706663b259
  OPENCLAW_PLATFORM_SHA: 70b4977ab2c8a990ebc324c8fa83ae1d10c0d2e2

extraEnv:
  - name: OPENCLAW_CONFIG_PATH
    value: /home/node/.openclaw/openclaw.k3s.json
  - name: TERM
    value: xterm-256color
  - name: TZ
    value: UTC
  - name: CLAUDE_WEB_SESSION_KEY
    value: ""
  - name: CLAUDE_WEB_COOKIE
    value: ""
  - name: CLAUDE_AI_SESSION_KEY
    value: ""
  - name: OPENCLAW_ALLOW_INSECURE_PRIVATE_WS
    value: ""

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: '2'
    memory: 4Gi

extraVolumeMounts:
  - name: openclaw-home
    mountPath: /home/node/.openclaw

extraVolumes:
  - name: openclaw-home
    hostPath:
      path: /home/mfshaf7/.openclaw
      type: Directory

serviceMonitor:
  enabled: true
  interval: 30s
