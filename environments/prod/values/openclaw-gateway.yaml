image:
  repository: ghcr.io/mfshaf7/openclaw-gateway
  tag: prod-b2c108701e5c
  digest: sha256:7c2b57e97ae92fca110700d9433ff411375cde6fe82a2a0c8f7b21b2b0b207ee
command:
- node
- dist/index.js
- gateway
- --bind
- lan
- --port
- '18789'
env:
  OPENCLAW_ENV: prod
  OPENCLAW_TELEGRAM_SHA: 846b79052630034b42a291ed21e6ff09eddfd9fa
  OPENCLAW_HOST_BRIDGE_SHA: 18ff28fa1844982a5d4433c6bc81e85fbdc417c9
  OPENCLAW_PLATFORM_SHA: af9c1fcfed45a18da401341d6771cc9b05526316
extraEnv:
- name: OPENCLAW_CONFIG_PATH
  value: /home/node/.openclaw/openclaw.k3s.json
- name: TERM
  value: xterm-256color
- name: TZ
  value: UTC
- name: CLAUDE_WEB_SESSION_KEY
  value: ''
- name: CLAUDE_WEB_COOKIE
  value: ''
- name: CLAUDE_AI_SESSION_KEY
  value: ''
- name: OPENCLAW_ALLOW_INSECURE_PRIVATE_WS
  value: ''
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: '2'
    memory: 4Gi
extraVolumeMounts:
- name: openclaw-home
  mountPath: /home/node/.openclaw
extraVolumes:
- name: openclaw-home
  hostPath:
    path: /home/mfshaf7/.openclaw
    type: Directory
serviceMonitor:
  enabled: true
  interval: 30s
