image:
  repository: ghcr.io/mfshaf7/openclaw-gateway
  tag: gateway-a2dd5b58b622
  digest: sha256:3e64268b0e996b41ae580006c320cadcf59759c45b8b63d7a4030b20a4d6debb
command:
- node
- dist/index.js
- gateway
- --bind
- lan
- --port
- '18789'
hostNetwork: true
dnsPolicy: ClusterFirstWithHostNet
enableServiceLinks: false
strategy:
  type: Recreate
env:
  OPENCLAW_ENV: prod
  OPENCLAW_TELEGRAM_SHA: 6cc0da02e38d8ad6e709185643d6f462be2a37b2
  OPENCLAW_HOST_BRIDGE_SHA: 9ffa7ab79c0a3c16a38a0c7b7c4e57bcb840105d
  OPENCLAW_PLATFORM_SHA: f3089ef1a57c77120551add4f55eb67750fdecdf
extraEnv:
- name: OPENCLAW_CONFIG_PATH
  value: /home/node/.openclaw/openclaw.k3s.json
- name: TERM
  value: xterm-256color
- name: TZ
  value: UTC
- name: CLAUDE_WEB_SESSION_KEY
  value: ''
- name: CLAUDE_WEB_COOKIE
  value: ''
- name: CLAUDE_AI_SESSION_KEY
  value: ''
- name: OPENCLAW_ALLOW_INSECURE_PRIVATE_WS
  value: ''
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: '2'
    memory: 4Gi
extraVolumeMounts:
- name: openclaw-home
  mountPath: /home/node/.openclaw/agents
  subPath: agents
- name: openclaw-home
  mountPath: /home/node/.openclaw/canvas
  subPath: canvas
- name: openclaw-home
  mountPath: /home/node/.openclaw/devices
  subPath: devices
- name: openclaw-home
  mountPath: /home/node/.openclaw/identity
  subPath: identity
- name: openclaw-home
  mountPath: /home/node/.openclaw/logs
  subPath: logs
- name: openclaw-home
  mountPath: /home/node/.openclaw/media
  subPath: media
- name: openclaw-home
  mountPath: /home/node/.openclaw/tasks
  subPath: tasks
- name: openclaw-home
  mountPath: /home/node/.openclaw/telegram
  subPath: telegram
- name: openclaw-home
  mountPath: /home/node/.openclaw/workspace
  subPath: workspace
- name: openclaw-home
  mountPath: /home/node/.openclaw/openclaw.k3s.json
  subPath: openclaw.k3s.json
- name: openclaw-home
  mountPath: /home/node/.openclaw/update-check.json
  subPath: update-check.json
extraVolumes:
- name: openclaw-home
  hostPath:
    path: /home/mfshaf7/.openclaw
    type: Directory
serviceMonitor:
  enabled: true
  interval: 30s
replicaCount: 1
