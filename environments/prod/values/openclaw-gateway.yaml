image:
  repository: ghcr.io/mfshaf7/openclaw-gateway
  tag: stage-d929aaef358c
  digest: sha256:63a8b56df348c60cb1ab4546c5c1b0b2141f2dbe6f9f857252e707eb8d747c44

command:
  - node
  - dist/index.js
  - gateway
  - --bind
  - lan
  - --port
  - "18789"

env:
  OPENCLAW_ENV: prod
  OPENCLAW_TELEGRAM_SHA: 05871229baf141bdba77e2b0a0a8cf23838c5036
  OPENCLAW_HOST_BRIDGE_SHA: 12ed13cb076689c1874b3710342a29706663b259
  OPENCLAW_PLATFORM_SHA: 70b4977ab2c8a990ebc324c8fa83ae1d10c0d2e2

extraEnv:
  - name: TERM
    value: xterm-256color
  - name: TZ
    value: UTC
  - name: CLAUDE_WEB_SESSION_KEY
    value: ""
  - name: CLAUDE_WEB_COOKIE
    value: ""
  - name: CLAUDE_AI_SESSION_KEY
    value: ""
  - name: OPENCLAW_ALLOW_INSECURE_PRIVATE_WS
    value: ""

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: '2'
    memory: 4Gi

extraVolumeMounts:
  - name: openclaw-home
    mountPath: /home/node/.openclaw

extraVolumes:
  - name: openclaw-home
    hostPath:
      path: /home/mfshaf7/.openclaw
      type: Directory

serviceMonitor:
  enabled: true
  interval: 30s
