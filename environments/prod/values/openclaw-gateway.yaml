image:
  repository: ghcr.io/mfshaf7/openclaw-gateway
  tag: "replace-me"
  digest: "sha256:replace-me"

env:
  OPENCLAW_ENV: prod
  OPENCLAW_TELEGRAM_SHA: replace-me
  OPENCLAW_HOST_BRIDGE_SHA: replace-me
  OPENCLAW_PLATFORM_SHA: replace-me

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 2Gi

serviceMonitor:
  enabled: true
  interval: 30s
