image:
  repository: ghcr.io/mfshaf7/openclaw-gateway
  tag: prod-0fcdee61af1b
  digest: sha256:2d8fa4375d409d6b3d7a47ef9933724811953a27710cbdfffb76c95cec131ac7
command:
- node
- dist/index.js
- gateway
- --bind
- lan
- --port
- '18789'
env:
  OPENCLAW_ENV: prod
  OPENCLAW_TELEGRAM_SHA: 7c92750ec69d380ebfae1aa5beb23a69d01debcd
  OPENCLAW_HOST_BRIDGE_SHA: 18ff28fa1844982a5d4433c6bc81e85fbdc417c9
  OPENCLAW_PLATFORM_SHA: c784f940fe95d04f31da44857fa1307f6714a4e6
extraEnv:
- name: OPENCLAW_CONFIG_PATH
  value: /home/node/.openclaw/openclaw.k3s.json
- name: TERM
  value: xterm-256color
- name: TZ
  value: UTC
- name: CLAUDE_WEB_SESSION_KEY
  value: ''
- name: CLAUDE_WEB_COOKIE
  value: ''
- name: CLAUDE_AI_SESSION_KEY
  value: ''
- name: OPENCLAW_ALLOW_INSECURE_PRIVATE_WS
  value: ''
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: '2'
    memory: 4Gi
extraVolumeMounts:
- name: openclaw-home
  mountPath: /home/node/.openclaw
extraVolumes:
- name: openclaw-home
  hostPath:
    path: /home/mfshaf7/.openclaw
    type: Directory
serviceMonitor:
  enabled: true
  interval: 30s
