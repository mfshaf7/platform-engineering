image:
  repository: ghcr.io/mfshaf7/openclaw-gateway
  tag: prod-95436119931b
  digest: sha256:bf847ba9af373c5d202647b01d2abdd7d6399034b7cb65786ae077824cffe0bc
command:
- node
- dist/index.js
- gateway
- --bind
- lan
- --port
- '18789'
hostNetwork: true
dnsPolicy: ClusterFirstWithHostNet
enableServiceLinks: false
strategy:
  type: Recreate
env:
  OPENCLAW_ENV: prod
  OPENCLAW_TELEGRAM_SHA: 5ffa7bbc55600ed39b33cf74fb8a17ed4a8b1674
  OPENCLAW_HOST_BRIDGE_SHA: a6f6d146fd91aa0f01d5ded4d768639f3a839b3e
  OPENCLAW_PLATFORM_SHA: 5fed996f59a002da3a032e7e6bcf73d4ab9772ec
extraEnv:
- name: OPENCLAW_CONFIG_PATH
  value: /home/node/.openclaw/openclaw.k3s.json
- name: TERM
  value: xterm-256colo
- name: TZ
  value: UTC
- name: CLAUDE_WEB_SESSION_KEY
  value: ''
- name: CLAUDE_WEB_COOKIE
  value: ''
- name: CLAUDE_AI_SESSION_KEY
  value: ''
- name: OPENCLAW_ALLOW_INSECURE_PRIVATE_WS
  value: ''
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: '2'
    memory: 4Gi
extraVolumeMounts:
- name: openclaw-home
  mountPath: /home/node/.openclaw
extraVolumes:
- name: openclaw-home
  hostPath:
    path: /home/mfshaf7/.openclaw
    type: Directory
serviceMonitor:
  enabled: true
  interval: 30s
