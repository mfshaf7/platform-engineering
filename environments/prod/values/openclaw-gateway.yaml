image:
  repository: ghcr.io/mfshaf7/openclaw-gateway
  tag: stage-35b7373aefc2
  digest: sha256:4cf1f7d97c5fd6b46c4950776451bd5d69788dcf16e4e576107865657e12c59c
command:
- node
- dist/index.js
- gateway
- --bind
- lan
- --port
- '18789'
env:
  OPENCLAW_ENV: prod
  OPENCLAW_TELEGRAM_SHA: f9f0446611ec813b0b71ede3f01293798e211585
  OPENCLAW_HOST_BRIDGE_SHA: a6f6d146fd91aa0f01d5ded4d768639f3a839b3e
  OPENCLAW_PLATFORM_SHA: ab702cbd18715cc6a1cddb8e38bfd6c5c5c7148e
extraEnv:
- name: OPENCLAW_CONFIG_PATH
  value: /home/node/.openclaw/openclaw.k3s.json
- name: TERM
  value: xterm-256color
- name: TZ
  value: UTC
- name: CLAUDE_WEB_SESSION_KEY
  value: ''
- name: CLAUDE_WEB_COOKIE
  value: ''
- name: CLAUDE_AI_SESSION_KEY
  value: ''
- name: OPENCLAW_ALLOW_INSECURE_PRIVATE_WS
  value: ''
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: '2'
    memory: 4Gi
extraVolumeMounts:
- name: openclaw-home
  mountPath: /home/node/.openclaw
extraVolumes:
- name: openclaw-home
  hostPath:
    path: /home/mfshaf7/.openclaw
    type: Directory
serviceMonitor:
  enabled: true
  interval: 30s
