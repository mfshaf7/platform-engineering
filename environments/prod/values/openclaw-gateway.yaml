image:
  repository: ghcr.io/mfshaf7/openclaw-gateway
  tag: gateway-10d71142ef17
  digest: sha256:dc168345074a9903215dafc1cd13398a92e7d4b2a361ea96fb6ca59f07a82c5c
command:
- node
- dist/index.js
- gateway
- --bind
- lan
- --port
- '18789'
hostNetwork: true
dnsPolicy: ClusterFirstWithHostNet
enableServiceLinks: false
strategy:
  type: Recreate
env:
  OPENCLAW_ENV: prod
  OPENCLAW_TELEGRAM_SHA: 912fdf93e47a71a67bbb2e4f87c8921e2d515486
  OPENCLAW_HOST_BRIDGE_SHA: 7973aa4dc6f826053aec02e75f859f35ea52d8aa
  OPENCLAW_PLATFORM_SHA: a08a8559bf65c5446806aaf7153a050bcdb016ed
extraEnv:
- name: OPENCLAW_CONFIG_PATH
  value: /home/node/.openclaw/openclaw.k3s.json
- name: TERM
  value: xterm-256color
- name: TZ
  value: UTC
- name: OPENCLAW_TELEGRAM_DROP_PENDING_UPDATES_ON_STARTUP
  value: '1'
- name: CLAUDE_WEB_SESSION_KEY
  value: ''
- name: CLAUDE_WEB_COOKIE
  value: ''
- name: CLAUDE_AI_SESSION_KEY
  value: ''
- name: OPENCLAW_ALLOW_INSECURE_PRIVATE_WS
  value: ''
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: '2'
    memory: 4Gi
extraVolumeMounts:
- name: openclaw-home
  mountPath: /home/node/.openclaw/agents
  subPath: agents
- name: openclaw-home
  mountPath: /home/node/.openclaw/canvas
  subPath: canvas
- name: openclaw-home
  mountPath: /home/node/.openclaw/devices
  subPath: devices
- name: openclaw-home
  mountPath: /home/node/.openclaw/identity
  subPath: identity
- name: openclaw-home
  mountPath: /home/node/.openclaw/logs
  subPath: logs
- name: openclaw-home
  mountPath: /home/node/.openclaw/media
  subPath: media
- name: openclaw-home
  mountPath: /home/node/.openclaw/tasks
  subPath: tasks
- name: openclaw-home
  mountPath: /home/node/.openclaw/telegram
  subPath: telegram
- name: openclaw-home
  mountPath: /home/node/.openclaw/workspace
  subPath: workspace
- name: openclaw-home
  mountPath: /home/node/.openclaw/openclaw.k3s.json
  subPath: openclaw.k3s.json
- name: openclaw-home
  mountPath: /home/node/.openclaw/update-check.json
  subPath: update-check.json
extraVolumes:
- name: openclaw-home
  hostPath:
    path: /home/mfshaf7/.openclaw
    type: Directory
serviceMonitor:
  enabled: true
  interval: 30s
replicaCount: 1
