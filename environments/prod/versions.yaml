environment: prod

gateway:
  image:
    repository: ghcr.io/example/openclaw-gateway
    tag: "0.0.1-dev"
    digest: "sha256:replace-me"
  chartVersion: "0.1.0"
  replicas: 1

sourceRepos:
  telegramEnhanced:
    repository: github.com/example/openclaw-telegram-enhanced
    commit: "replace-me"
  hostBridge:
    repository: github.com/example/openclaw-host-bridge
    commit: "replace-me"
  isolatedDeployment:
    repository: github.com/example/openclaw-isolated-deployment
    commit: "replace-me"
  platformEngineering:
    repository: github.com/mfshaf7/platform-engineering
    commit: "replace-me"

argocd:
  namespace: argocd
  project: openclaw-platform

observability:
  kubePrometheusStackChartVersion: "58.2.2"
  grafanaAdminSecretStoreRef: "grafana-admin"

externalSecrets:
  chartVersion: "0.10.5"
  clusterSecretStore: "openclaw-cluster-secrets"

hostControl:
  wslDistribution: "Ubuntu"
  bridgeSystemdUnit: "openclaw-host-bridge.service"
  recoverySystemdUnit: "openclaw-host-recovery.service"
