apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: platform-engineering-repo
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: platform-vault
  target:
    name: platform-engineering-repo
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        url: "{{ .url }}"
        username: "{{ .username }}"
        password: "{{ .password }}"
  dataFrom:
    - extract:
        key: platform/argocd/platform-engineering-repo
