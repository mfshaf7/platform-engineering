apiVersion: apps/v1
kind: Deployment
metadata:
  name: operator-orchestration-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: operator-orchestration-service
  template:
    metadata:
      labels:
        app: operator-orchestration-service
    spec:
      containers:
        - name: operator-orchestration-service
          image: ghcr.io/mfshaf7/operator-orchestration-service@sha256:4d0af1e4f81191a6f565c03a16e2d9f98e122ce891ec11609737d165618f98a8
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SERVICE_VERSION
              value: "0.1.0"
            - name: OPENPROJECT_BASE_URL
              value: http://openproject.openproject.svc.cluster.local:8080
            - name: OPENPROJECT_HOST_HEADER
              value: 127.0.0.1:32083
            - name: OPENPROJECT_PROJECT_IDENTIFIER
              value: workspace-proposals
            - name: OPENPROJECT_DELIVERY_PROJECT_IDENTIFIER
              value: workspace-delivery-art
            - name: OPENPROJECT_IDEA_TYPE_ID
              value: "41"
            - name: OPENPROJECT_DELIVERY_TOP_LEVEL_TYPE_ID
              value: "38"
            - name: OPENPROJECT_CAPTURED_STATUS_ID
              value: "81"
            - name: OPENPROJECT_TRIAGED_STATUS_ID
              value: "82"
            - name: OPENPROJECT_PARKED_STATUS_ID
              value: "83"
            - name: OPENPROJECT_ACCEPTED_STATUS_ID
              value: "85"
            - name: OPENPROJECT_REJECTED_STATUS_ID
              value: "80"
            - name: OPENPROJECT_DELIVERY_NEW_STATUS_ID
              value: "67"
            - name: OPENPROJECT_CUSTOM_FIELD_SUSPECTED_OWNER_ID
              value: "3"
            - name: OPENPROJECT_CUSTOM_FIELD_AFFECTED_SCOPE_ID
              value: "4"
            - name: OPENPROJECT_CUSTOM_FIELD_TRUST_BOUNDARY_AREAS_ID
              value: "5"
            - name: OPENPROJECT_CUSTOM_FIELD_TRIAGE_CONFIDENCE_ID
              value: "8"
            - name: OPENPROJECT_CUSTOM_FIELD_AI_ASSIST_LANE_ID
              value: "9"
            - name: OPENPROJECT_CUSTOM_FIELD_SOURCE_SURFACE_ID
              value: "1"
            - name: OPENPROJECT_CUSTOM_FIELD_SOURCE_REFERENCE_ID
              value: "2"
            - name: OPENPROJECT_CUSTOM_FIELD_DELIVERY_REF_ID
              value: "25"
            - name: OPENPROJECT_DELIVERY_CUSTOM_FIELD_ORIGIN_IDEA_REF_ID
              value: "12"
            - name: OPENPROJECT_DELIVERY_CUSTOM_FIELD_PM2_PHASE_ID
              value: "11"
            - name: OPENPROJECT_DELIVERY_CUSTOM_FIELD_TARGET_PI_ID
              value: "16"
            - name: WORKSPACE_OWNER_TOKENS_JSON
              value: '["component:argo-cd","component:external-secrets","component:host-control-plugin","component:observability","component:openclaw-host-bridge","component:openclaw-runtime-distribution","component:openclaw-telegram-channel","component:operator-orchestration-service","component:platform-postgresql","component:vault","product:openclaw","product:openproject","repo:openclaw-host-bridge","repo:openclaw-runtime-distribution","repo:openclaw-telegram-enhanced","repo:operator-orchestration-service","repo:platform-engineering","repo:security-architecture","repo:workspace-governance"]'
            - name: WORKSPACE_SCOPE_TOKENS_JSON
              value: '["component:argo-cd","component:external-secrets","component:host-control-plugin","component:observability","component:openclaw-host-bridge","component:openclaw-runtime-distribution","component:openclaw-telegram-channel","component:operator-orchestration-service","component:platform-postgresql","component:vault","product:openclaw","product:openproject","repo:openclaw-host-bridge","repo:openclaw-runtime-distribution","repo:openclaw-telegram-enhanced","repo:operator-orchestration-service","repo:platform-engineering","repo:security-architecture","repo:workspace-governance"]'
            - name: CALLER_ALLOWED_IDS
              value: openclaw-stage-gateway
          envFrom:
            - secretRef:
                name: operator-orchestration-service-secrets
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
