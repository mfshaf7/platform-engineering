apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: operator-orchestration-service-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: platform-vault
  target:
    name: operator-orchestration-service-secrets
    creationPolicy: Owner
  data:
    - secretKey: OPENPROJECT_API_TOKEN
      remoteRef:
        key: components/operator-orchestration-service/prod/openproject
        property: apiToken
    - secretKey: CALLER_AUTH_SHARED_SECRET
      remoteRef:
        key: components/operator-orchestration-service/shared/runtime
        property: callerSharedSecret
