schema_version: 1
id: temporal-component-commissioning-proof
title: Temporal controlled component commissioning proof
authorityType: runtime-drill
drillType: component-commissioning-proof
targetEnvironment: dev-integration
targetLanes:
  - devint
evidenceOwner: platform-engineering
authorization:
  required: true
  artifactType: controlled-runtime-proof-authorization
  schemaRef: https://github.com/mfshaf7/workspace-governance/blob/main/contracts/schemas/controlled-runtime-proof-authorization.schema.json
  policyRef: https://github.com/mfshaf7/workspace-governance/blob/main/contracts/developer-integration-policy.yaml#controlled_proof
  targetProfileId: temporal
  targetProfileLifecycle: build-admitted
  maxRuns: 1
scope:
  sourceRepos:
    - platform-engineering
    - operator-orchestration-service
    - workspace-governance
    - workspace-governance-control-fabric
    - security-architecture
  surfaces:
    - id: temporal-runtime
      ownerRepo: platform-engineering
      lane: devint
      kind: build-admitted-component
      summary: Permit-bound Temporal runtime, PostgreSQL persistence, namespace, identities, and task queues.
    - id: oos-validation-readiness-worker
      ownerRepo: operator-orchestration-service
      lane: devint
      kind: aggregate-workflow-worker
      summary: OOS worker for the exact validation-readiness-run definition and queue generation.
    - id: wgcf-readiness-activity-worker
      ownerRepo: workspace-governance-control-fabric
      lane: devint
      kind: bounded-activity-worker
      summary: WGCF worker for the permit-bound validation and readiness activity queue.
preconditions:
  - id: exact-authorization-bound
    summary: Bind one unexpired permit reference and digest before the baseline snapshot is created.
  - id: baseline-snapshot-captured
    summary: Capture the exact non-running or existing pre-proof state before any scoped mutation.
  - id: source-state-declared
    summary: Record the exact source revisions and immutable runtime artifacts named by the permit.
  - id: security-and-operator-approval-bound
    summary: Confirm the permit carries separate Security authorization and explicit operator approval.
  - id: normal-launch-remains-denied
    summary: Confirm ordinary profile launch and every unlisted definition or action remain unavailable.
verificationPack:
  checks:
    - id: permit-and-scope-bindings
      category: authorization
      requiredByDefault: true
      acceptedStatuses:
        - passed
      summary: The run and every participating owner match the exact permit reference, digest, scope, and validity window.
    - id: nominal-orchestration-receipt
      category: orchestration
      requiredByDefault: true
      acceptedStatuses:
        - passed
      summary: One validation-readiness-run completes with correlated OOS and WGCF receipts.
    - id: restart-and-replay
      category: durability
      requiredByDefault: true
      acceptedStatuses:
        - passed
      summary: Worker and Temporal restarts preserve deterministic progress and replay compatibility.
    - id: idempotency-and-control
      category: control
      requiredByDefault: true
      acceptedStatuses:
        - passed
      summary: Duplicate suppression and cancellation preserve one bounded, reviewable outcome.
    - id: dependency-and-identity-failures
      category: failure-boundary
      requiredByDefault: true
      acceptedStatuses:
        - passed
      summary: Unavailable dependency, wrong identity, and wrong queue attempts fail closed without extra effects.
    - id: payload-boundary
      category: data-boundary
      requiredByDefault: true
      acceptedStatuses:
        - passed
      summary: Workflow and activity payloads remain reference-only, bounded, and free of raw secret or context material.
    - id: backup-and-restore
      category: persistence
      requiredByDefault: true
      acceptedStatuses:
        - passed
      summary: The permit-bound backup and restore scenario preserves the expected Temporal persistence state.
    - id: exact-baseline-restore
      category: restore
      requiredByDefault: true
      acceptedStatuses:
        - passed
      summary: Every scoped runtime and worker surface matches the captured pre-proof baseline after removal and restore.
exceptionHandling:
  decisions:
    - remove
    - workaround
    - accept-risk
    - defer
evidenceModel:
  templatePath: environments/shared/runtime-drills/temporal-component-commissioning-proof-evidence-template.yaml
  requiredSections:
    - run
    - authoritativeArtifacts
    - baselineAttestation
    - activationSummary
    - verificationResults
    - exceptionRegister
    - supplementalRecords
    - restoreAttestation
    - finalAssessment
restoreMode: exact-baseline
restoreScope:
  surfaces:
    - id: temporal-runtime
      summary: Remove the scoped runtime and restore namespace, storage, credential, and operator-local state to the captured baseline.
    - id: oos-validation-readiness-worker
      summary: Restore the OOS worker, queue polling, and process state to the captured baseline.
    - id: wgcf-readiness-activity-worker
      summary: Restore the WGCF activity worker, queue polling, and process state to the captured baseline.
