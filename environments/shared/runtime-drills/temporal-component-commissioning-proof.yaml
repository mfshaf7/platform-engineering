schema_version: 1
id: temporal-component-commissioning-proof
title: Temporal controlled component commissioning proof
authorityType: runtime-drill
drillType: component-commissioning-proof
targetEnvironment: dev-integration
targetLanes:
  - devint
evidenceOwner: platform-engineering
sourceEnablement:
  status: source-reviewed
  implementationWorkItemRef: openproject://work_packages/825
  snapshotAllowed: true
  requiredControls:
    - capture-preauthorization-baseline-artifact
    - validate-authorization-artifact-and-digest
    - enforce-semantic-binding-uniqueness
    - verify-rfc8785-claims-approval-bindings
    - consume-authorization-atomically
    - resume-only-exact-uncommitted-snapshot
    - lease-operator-scope-before-execution-claim
    - execute-runtime-actions-from-permit-bound-source
    - verify-immutable-baseline-digest
    - verify-runtime-scoped-restore
    - emit-controlled-proof-result
authorization:
  required: true
  artifactType: controlled-runtime-proof-authorization
  schemaRef: https://github.com/mfshaf7/workspace-governance/blob/main/contracts/schemas/controlled-runtime-proof-authorization.schema.json
  policyRef: https://github.com/mfshaf7/workspace-governance/blob/main/contracts/developer-integration-policy.yaml#controlled_proof
  securityReviewRef: https://github.com/mfshaf7/security-architecture/blob/main/docs/reviews/components/2026-08-01-temporal-controlled-commissioning-proof-contract.md
  targetProfileId: temporal
  targetProfileLifecycle: build-admitted
  maxRuns: 1
  permitIssuer:
    ownerRepo: platform-engineering
    sourceReviewWorkItemRef: openproject://work_packages/825
    mergedSourceRequiredBeforeSecurityAuthorization: true
  executor:
    ownerRepo: platform-engineering
    sourceReviewWorkItemRef: openproject://work_packages/825
    mergedSourceRequiredBeforeSecurityAuthorization: true
  securityAuthorization:
    ownerRepo: security-architecture
    excludedFromExecutionSourceClaims: true
    approvalEnvelopeBinds:
      - source-revision
      - normalized-source-path
      - artifact-reference
      - artifact-digest
  terminalCleanupAuthority:
    mode: exact-baseline-restore-only
    appliesTo: already-started-run
    triggerScope: any-triggered-stop-condition
    scopeBinding: exact-captured-restore-scope
    newProofActionsDenied: true
    scopeExpansionDenied: true
    runtimeRetentionDenied: true
    permittedActions:
      - remove-scoped-runtime
      - restore-exact-baseline
      - record-restore-evidence
      - record-governed-exception
    terminationConditions:
      - exact-baseline-restored
      - governed-exception-recorded
resultArtifact:
  required: true
  artifactType: controlled-runtime-proof-result
  schemaRef: https://github.com/mfshaf7/workspace-governance/blob/main/contracts/schemas/controlled-runtime-proof-result.schema.json
  schemaVersion: 2
scope:
  sourceRepos:
    - platform-engineering
    - operator-orchestration-service
    - workspace-governance
    - workspace-governance-control-fabric
  surfaces:
    - id: temporal-runtime
      ownerRepo: platform-engineering
      lane: devint
      kind: build-admitted-component
      summary: Permit-bound Temporal runtime, PostgreSQL persistence, namespace, identities, and task queues.
    - id: oos-validation-readiness-worker
      ownerRepo: operator-orchestration-service
      lane: devint
      kind: aggregate-workflow-worker
      summary: OOS worker for the exact validation-readiness-run definition and queue generation.
    - id: wgcf-readiness-activity-worker
      ownerRepo: workspace-governance-control-fabric
      lane: devint
      kind: bounded-activity-worker
      summary: WGCF worker for the permit-bound validation and readiness activity queue.
preconditions:
  - id: exact-authorization-bound
    summary: Bind one unexpired permit whose baseline reference and digest match the immutable artifact captured before issuance.
  - id: baseline-attestations-complete
    summary: Import and verify the pre-issued baseline artifact and operator-reviewable evidence for every scoped surface before any mutation.
  - id: source-state-declared
    summary: Record the exact execution source revisions and immutable runtime artifacts named by the permit.
  - id: security-and-operator-approval-bound
    summary: Confirm the permit separately binds the merged Security artifact revision, path, reference, and digest plus explicit operator approval.
  - id: normal-launch-remains-denied
    summary: Confirm ordinary profile launch and every unlisted definition or action remain unavailable.
verificationPack:
  checks:
    - id: permit-and-scope-bindings
      category: authorization
      requiredByDefault: true
      acceptedStatuses:
        - passed
      summary: The run and every participating owner match the exact permit reference, digest, scope, and validity window.
    - id: nominal-orchestration-receipt
      category: orchestration
      requiredByDefault: true
      acceptedStatuses:
        - passed
      summary: One validation-readiness-run completes with correlated OOS and WGCF receipts.
    - id: restart-and-replay
      category: durability
      requiredByDefault: true
      acceptedStatuses:
        - passed
      summary: Worker and Temporal restarts preserve deterministic progress and replay compatibility.
    - id: idempotency-and-control
      category: control
      requiredByDefault: true
      acceptedStatuses:
        - passed
      summary: Duplicate suppression and cancellation preserve one bounded, reviewable outcome.
    - id: dependency-and-identity-failures
      category: failure-boundary
      requiredByDefault: true
      acceptedStatuses:
        - passed
      summary: Unavailable dependency, wrong identity, and wrong queue attempts fail closed without extra effects.
    - id: payload-boundary
      category: data-boundary
      requiredByDefault: true
      acceptedStatuses:
        - passed
      summary: Workflow and activity payloads remain reference-only, bounded, and free of raw secret or context material.
    - id: backup-and-restore
      category: persistence
      requiredByDefault: true
      acceptedStatuses:
        - passed
      summary: The permit-bound backup and restore scenario preserves the expected Temporal persistence state.
    - id: exact-baseline-restore
      category: restore
      requiredByDefault: true
      acceptedStatuses:
        - passed
      summary: Every scoped runtime and worker surface matches the captured pre-proof baseline after removal and restore.
exceptionHandling:
  decisions:
    - remove
    - workaround
    - accept-risk
    - defer
evidenceModel:
  templatePath: environments/shared/runtime-drills/temporal-component-commissioning-proof-evidence-template.yaml
  requiredSections:
    - run
    - authoritativeArtifacts
    - baselineAttestation
    - activationSummary
    - verificationResults
    - exceptionRegister
    - supplementalRecords
    - restoreAttestation
    - finalAssessment
restoreMode: exact-baseline
restoreScope:
  surfaces:
    - id: temporal-runtime
      summary: Remove the scoped runtime and restore namespace, storage, credential, and operator-local state to the captured baseline.
    - id: oos-validation-readiness-worker
      summary: Remove the operator-scoped OOS worker deployment and restore its captured absent runtime state.
    - id: wgcf-readiness-activity-worker
      summary: Remove the operator-scoped WGCF worker deployment and restore its captured absent runtime state.
