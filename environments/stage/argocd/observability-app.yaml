apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openclaw-observability-stage
  namespace: argocd
spec:
  project: platform-core
  source:
    repoURL: oci://ghcr.io/prometheus-community/charts/kube-prometheus-stack
    chart: kube-prometheus-stack
    targetRevision: 58.2.2
    helm:
      values: |
        grafana:
          enabled: true
          defaultDashboardsEnabled: true
          admin:
            existingSecret: grafana-admin-credentials
            userKey: admin-user
            passwordKey: admin-password
          service:
            type: NodePort
            nodePort: 32081
        prometheus:
          prometheusSpec:
            retention: 5d
        additionalPrometheusRulesMap:
          platform-control-plane:
            groups:
              - name: platform-control-plane
                rules:
                  - alert: ArgoApplicationOutOfSync
                    expr: argocd_app_info{sync_status!="Synced"} == 1
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: Argo CD application is out of sync
                      description: One or more Argo CD applications have remained out of sync for 10 minutes.
                  - alert: OpenClawGatewayUnavailable
                    expr: up{job="openclaw-gateway"} == 0
                    for: 5m
                    labels:
                      severity: critical
                    annotations:
                      summary: OpenClaw gateway metrics endpoint is unavailable
                      description: Prometheus cannot scrape the OpenClaw gateway endpoint.
                  - alert: VaultClusterUnavailable
                    expr: kube_statefulset_status_replicas_ready{namespace="vault",statefulset="vault"} < kube_statefulset_replicas{namespace="vault",statefulset="vault"}
                    for: 5m
                    labels:
                      severity: critical
                    annotations:
                      summary: Vault cluster has unavailable replicas
                      description: One or more Vault replicas are not ready.
                  - alert: VaultArgoApplicationUnhealthy
                    expr: argocd_app_info{name="vault",health_status!="Healthy"} == 1
                    for: 5m
                    labels:
                      severity: critical
                    annotations:
                      summary: Vault Argo application is unhealthy
                      description: The Vault Argo CD application is not healthy.
                  - alert: PlatformSecretsApplicationUnhealthy
                    expr: argocd_app_info{name=~"platform-secrets-stage|platform-secrets-prod",health_status!="Healthy"} == 1
                    for: 5m
                    labels:
                      severity: critical
                    annotations:
                      summary: Platform secret delivery is unhealthy
                      description: A platform secrets Argo CD application is not healthy, indicating ESO sync or store issues.
        alertmanager:
          enabled: true
        prometheus-node-exporter:
          hostRootFsMount:
            enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: observability-stage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
