apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-dashboards-stage
  namespace: argocd
spec:
  project: platform-core
  source:
    repoURL: https://github.com/mfshaf7/platform-engineering.git
    targetRevision: main
    path: environments/stage/observability-assets
  destination:
    server: https://kubernetes.default.svc
    namespace: observability-stage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
