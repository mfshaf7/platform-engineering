apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-secrets-stage
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform-core
  source:
    repoURL: https://github.com/mfshaf7/platform-engineering.git
    targetRevision: main
    path: environments/stage/secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: openclaw-stage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
