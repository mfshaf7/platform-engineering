apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: openclaw-gateway-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: platform-vault
  target:
    name: openclaw-gateway-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: products/openclaw/stage/gateway
