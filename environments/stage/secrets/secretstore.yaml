apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: platform-vault
spec:
  provider:
    vault:
      server: http://vault.vault.svc.cluster.local:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: platform-stage-secrets
          serviceAccountRef:
            name: platform-vault-reader
            audiences:
              - vault
