  mountPath: /home/node/.openclaw/tasks
  subPath: tasks
- name: openclaw-home
  mountPath: /home/node/.openclaw/telegram
  subPath: telegram
- name: openclaw-home
  mountPath: /home/node/.openclaw/workspace
  subPath: workspace
- name: openclaw-home
  mountPath: /home/node/.openclaw/openclaw.stage.k3s.json
