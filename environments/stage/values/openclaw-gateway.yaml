image:
  repository: ghcr.io/mfshaf7/openclaw-gateway
  tag: "stage-fc43778461ff"
  digest: "sha256:bad14d09a9b5d6aa46e736cb85b6804cb2c40edefb827c4bc26989d8ad0873a5"
  pullPolicy: IfNotPresent

command:
  - node
  - dist/index.js
  - gateway
  - --bind
  - lan
  - --port
  - "18789"

hostNetwork: true
dnsPolicy: ClusterFirstWithHostNet

enableServiceLinks: false

service:
  type: ClusterIP
  port: 18789

env:
  OPENCLAW_ENV: stage
  OPENCLAW_TELEGRAM_SHA: 846b79052630034b42a291ed21e6ff09eddfd9fa
  OPENCLAW_HOST_BRIDGE_SHA: 18ff28fa1844982a5d4433c6bc81e85fbdc417c9
  OPENCLAW_PLATFORM_SHA: 1b4871dc961d0e23767e3d1cb56db232df777b74

extraEnv:
  - name: OPENCLAW_CONFIG_PATH
    value: /home/node/.openclaw/openclaw.stage.k3s.json
  - name: TERM
    value: xterm-256color
  - name: TZ
    value: UTC
  - name: CLAUDE_WEB_SESSION_KEY
    value: ""
  - name: CLAUDE_WEB_COOKIE
    value: ""
  - name: CLAUDE_AI_SESSION_KEY
    value: ""
  - name: OPENCLAW_ALLOW_INSECURE_PRIVATE_WS
    value: ""

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 4Gi

extraVolumeMounts:
  - name: openclaw-home
    mountPath: /home/node/.openclaw

extraVolumes:
  - name: openclaw-home
    hostPath:
      path: /home/mfshaf7/.openclaw
      type: Directory
