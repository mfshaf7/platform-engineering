image:
  repository: ghcr.io/mfshaf7/openclaw-gateway
  tag: "stage-8f1ad2c27ef7"
  digest: "sha256:abbfe46e974b7c0444ada1989a42ef02e34efe1f3f59f048bb05a03f5d32c3c5"
  pullPolicy: IfNotPresent

command:
  - node
  - dist/index.js
  - gateway
  - --bind
  - lan
  - --port
  - "18789"

hostNetwork: true
dnsPolicy: ClusterFirstWithHostNet

enableServiceLinks: false

service:
  type: ClusterIP
  port: 18789

env:
  OPENCLAW_ENV: stage
  OPENCLAW_TELEGRAM_SHA: 846b79052630034b42a291ed21e6ff09eddfd9fa
  OPENCLAW_HOST_BRIDGE_SHA: 18ff28fa1844982a5d4433c6bc81e85fbdc417c9
  OPENCLAW_PLATFORM_SHA: 45073ae519fbe486f9babfed75a021c0e06a00cd

extraEnv:
  - name: OPENCLAW_CONFIG_PATH
    value: /home/node/.openclaw/openclaw.stage.k3s.json
  - name: TERM
    value: xterm-256color
  - name: TZ
    value: UTC
  - name: CLAUDE_WEB_SESSION_KEY
    value: ""
  - name: CLAUDE_WEB_COOKIE
    value: ""
  - name: CLAUDE_AI_SESSION_KEY
    value: ""
  - name: OPENCLAW_ALLOW_INSECURE_PRIVATE_WS
    value: ""

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 4Gi

extraVolumeMounts:
  - name: openclaw-home
    mountPath: /home/node/.openclaw

extraVolumes:
  - name: openclaw-home
    hostPath:
      path: /home/mfshaf7/.openclaw
      type: Directory
