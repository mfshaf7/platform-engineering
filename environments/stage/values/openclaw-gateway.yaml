  OPENCLAW_TELEGRAM_SHA: 642526faf216723556be830ac7308e4325de554f
  OPENCLAW_HOST_BRIDGE_SHA: a6f6d146fd91aa0f01d5ded4d768639f3a839b3e
  OPENCLAW_PLATFORM_SHA: be4174df8caf883f2d054e27f6e79f0743ff0f55
extraEnv:
