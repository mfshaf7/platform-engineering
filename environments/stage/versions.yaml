environment: stage

gateway:
  build:
    baseImage: openclaw:stable-preview
    dockerfile: deployment/Dockerfile.telegram-bundled.example
  image:
    repository: docker.io/library/openclaw
    tag: "local"
    digest: ""
  chartVersion: "0.1.0"
  replicas: 1

sourceRepos:
  telegramEnhanced:
    repository: github.com/mfshaf7/openclaw-telegram-enhanced
    commit: "replace-me"
  hostBridge:
    repository: github.com/mfshaf7/openclaw-host-bridge
    commit: "replace-me"
  isolatedDeployment:
    repository: github.com/mfshaf7/openclaw-isolated-deployment
    commit: "replace-me"
  platformEngineering:
    repository: github.com/mfshaf7/platform-engineering
    commit: "6ca129c4bcc741b8cccc1697051064b311171412"

argocd:
  namespace: argocd
  project: openclaw-platform

observability:
  kubePrometheusStackChartVersion: "58.2.2"

hostControl:
  wslDistribution: "Ubuntu"
  bridgeSystemdUnit: "openclaw-host-bridge.service"
  recoverySystemdUnit: "openclaw-host-recovery.service"
