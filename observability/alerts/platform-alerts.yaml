groups:
  - name: platform-engineering
    rules:
      - alert: ArgoApplicationOutOfSync
        expr: argocd_app_info{sync_status!="Synced"} == 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Argo CD application is out of sync
          description: One or more Argo CD applications have remained out of sync for 10 minutes.
      - alert: OpenClawGatewayUnavailable
        expr: up{job="openclaw-gateway"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: OpenClaw gateway metrics endpoint is unavailable
          description: Prometheus cannot scrape the OpenClaw gateway endpoint.
