schema_version: 1
access_plane:
  id: governed-ai-gateway
  status: active
  owner_repo: platform-engineering
  security_owner: security-architecture
  purpose: >
    Provide the shared governed invocation boundary for central governance
    consumers. Consumers call this boundary instead of carrying provider
    credentials or direct provider clients.
  profile_registry_ref:
    repo: platform-engineering
    path: security/governed-ai-model-profiles.yaml
  runtime_assist_contract_ref:
    repo: platform-engineering
    path: security/governed-ai-runtime-assist-contract.yaml
  allowed_profiles:
    - intake-classifier-v1
  provider_routes:
    - route_id: ollama-local-host
      provider: ollama
      api_family: ollama-chat
      endpoint_origin: http://host.docker.internal:11434
      endpoint_path: /api/chat
      status: active
      credential_required: false
      allowed_profiles:
        - intake-classifier-v1
      allowed_models:
        - qwen3:8b
    - route_id: openai-responses-api
      provider: openai
      api_family: responses
      endpoint_origin: https://api.openai.com
      endpoint_path: /v1/responses
      status: selected-not-active
      credential_required: true
      allowed_profiles:
        - intake-classifier-v1
      allowed_models:
        - gpt-5.6-terra
  allowed_callers:
    - caller_id: workspace-governance/intake-assist
      purpose: workspace-intake-assist
      required_profile: intake-classifier-v1
      required_provider_output_schema_ref:
        repo: platform-engineering
        path: security/schemas/intake-classification-result.schema.json
      accepted_record_schema_ref:
        repo: workspace-governance
        path: contracts/schemas/intake-ai-suggestion.schema.json
  caller_identity:
    required_fields:
      - caller_id
      - caller_repo
      - caller_workflow
      - decision_or_correlation_id
      - requested_profile_id
    propagation_boundary: access-plane-request
    operator_identity_required_when_human_approval_required: true
  provider_credential_custody:
    owner: platform-engineering
    allowed_secret_store: vault
    consumer_provider_credentials_allowed: false
    provider_secret_projection_allowed_only_to:
      - governed-ai-gateway runtime namespace
      - devint-governed-ai-gateway profile namespace
    provider_secret_refs:
      - provider: openai
        route_id: openai-responses-api
        vault_path: components/governed-ai-gateway/shared/provider
        property: apiToken
    devint_secret_ref:
      namespace_pattern: devint-governed-ai-gateway-<operator>
      secret_name: governed-ai-gateway-provider
      property: GOVERNED_AI_PROVIDER_TOKEN
      consumer_projection_allowed: false
  audit_contract:
    sink_status: devint-local-ledger
    retention_owner: platform-engineering
    devint_ledger_ref:
      namespace_pattern: devint-governed-ai-gateway-<operator>
      pvc: governed-ai-gateway-audit
      path: /var/lib/governed-ai-gateway/audit-ledger.jsonl
    required_fields:
      - event_time
      - correlation_id
      - caller_identity
      - operator_identity
      - approved_profile_id
      - invocation_path
      - upstream_provider
      - provider_route
      - upstream_model
      - upstream_model_digest
      - provider_runtime_version
      - prompt_version
      - provider_schema_valid
      - provider_latency_ms
      - provider_usage
      - purpose
      - output_schema_ref
      - policy_decision
      - outcome
      - operator_acceptance_state
      - override_reason
  admission_policy:
    default_decision: deny
    require_active_profile: true
    require_caller_allowlist_match: true
    require_data_scope_match: true
    require_output_schema_match: true
    require_human_approval_for_governance_decisions: true
    direct_provider_passthrough_allowed: false
  devint_enforcement_ref:
    repo: platform-engineering
    path: security/governed-ai-devint-egress-policy.yaml
  activation_state:
    profile_activation_allowed: true
    active_environment: dev-integration
    active_binding: local-ollama-qwen3-8b
    reason: >
      The reviewed local Ollama binding is active for platform-owned
      dev-integration proof. Workspace consumer use remains separately gated
      until its dependent activation work completes. The OpenAI route is not
      active.
