  agent-console-assistant-v1:
    status: active
    purpose: agent-console-assist
    invocation_path: governed-ai-gateway
    selected_binding_by_environment:
      dev-integration: local-ollama-qwen3-8b
    bindings:
      local-ollama-qwen3-8b:
        status: active
        environments:
          - dev-integration
        provider: ollama
        provider_route: ollama-local-host
        upstream_model: qwen3:8b
        model_digest: 500a1f067a9f782620b40bee6f7b0c89e17ae61f686b92c24933e4ca4b2b8b41
        runtime_version: 0.40.1
        selection:
          selected_at: "2026-10-09"
          selected_by: operator:workspace-owner
          basis: bounded-agent-console-devint-candidate
          documentation_ref: https://ollama.com/library/qwen3:8b
    allowed_callers:
      - operator-orchestration-service/agent-console
    allowed_data_scope:
      - CGG receipt-bound model-safe Agent Console content
      - CGG packet, redaction receipt, projection receipt, and artifact digest references
      - operator-supplied Agent Console prompt
      - OOS-owned versioned Agent Console task instruction
      - OOS session, invocation, and agent instance bindings
    runtime_limits:
      max_request_bytes: 300000
      max_output_tokens: 2048
      timeout_seconds: 60
      retry_count: 1
      max_concurrency: 2
    task_contracts:
      default_task_kind: assistant_response
      allowed:
        assistant_response:
          contract_ref: oos.agent-console.interaction.v1
          contract_version: "1.0"
          contract_source_ref:
            repo: operator-orchestration-service
            path: contracts/agent-console/manifest.json
          instruction_owner_repo: operator-orchestration-service
          instruction_source: caller
          provider_output_schema_ref:
            repo: platform-engineering
            path: security/schemas/agent-console-response.schema.json
          input_contract:
            allowed_fields:
              - task_instruction
              - operator_prompt
              - interaction_mode
              - model_safe_packet
              - session_binding
            required_fields:
              - task_instruction
              - operator_prompt
              - interaction_mode
              - model_safe_packet
              - session_binding
            model_safe_packet_required_fields:
              - packet_ref
              - redaction_receipt_ref
              - projection_receipt_ref
              - artifact_digest
              - content
    provider_output_schema_ref:
      repo: platform-engineering
      path: security/schemas/agent-console-response.schema.json
    accepted_record_schema_ref:
      repo: operator-orchestration-service
      path: contracts/agent-console/model-response.schema.json
    human_approval_required: true
    direct_provider_access_allowed: false
    security_review_ref:
      repo: security-architecture
      path: docs/reviews/platform/2026-04-29-bounded-governed-ai-runtime-assist-activation.md
    activation_review_ref: openproject://work_packages/1248
    notes: >
      The bounded Agent Console model profile is available only through the
      governed AI gateway in local dev-integration. The OOS and CGG runtime
      hooks remain default-off, and gate:agent-console-operating-acceptance at
      #1248 blocks composed operating-ready proof. Paid-provider, stage, prod,
      and direct consumer-to-provider activation remain prohibited.
