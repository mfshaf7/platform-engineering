schema_version: 1
registry:
  owner_repo: platform-engineering
  security_owner: security-architecture
  review_ref:
    repo: security-architecture
    path: docs/reviews/platform/2026-04-18-governed-ai-intake-assist-and-model-profiles.md
model_profiles:
  intake-classifier-v1:
    status: active
    purpose: workspace-intake-assist
    invocation_path: governed-ai-gateway
    selected_binding_by_environment:
      dev-integration: local-ollama-qwen3-8b
    bindings:
      local-ollama-qwen3-8b:
        status: active
        environments:
          - dev-integration
        provider: ollama
        provider_route: ollama-local-host
        upstream_model: qwen3:8b
        model_digest: 500a1f067a9f782620b40bee6f7b0c89e17ae61f686b92c24933e4ca4b2b8b41
        runtime_version: 0.40.1
        selection:
          selected_at: "2026-08-20"
          selected_by: operator:workspace-owner
          basis: stable-low-latency-local-classification
          documentation_ref: https://ollama.com/library/qwen3:8b
      openai-terra:
        status: selected-not-active
        environments:
          - dev-integration
          - stage
          - prod
        provider: openai
        provider_route: openai-responses-api
        upstream_model: gpt-5.6-terra
        selection:
          selected_at: "2026-08-20"
          selected_by: operator:workspace-owner
          basis: future-paid-provider-route
          documentation_ref: https://developers.openai.com/api/docs/models/gpt-5.6-terra
    allowed_callers:
      - workspace-governance/intake-assist
    allowed_data_scope:
      - repo metadata
      - top-level manifests
      - README excerpts
      - AGENTS excerpts
      - operator-supplied intake notes
    runtime_limits:
      max_request_bytes: 16384
      max_output_tokens: 64
      timeout_seconds: 30
      retry_count: 1
      max_concurrency: 2
    task_contracts:
      default_task_kind: intake_classification
      allowed:
        intake_classification:
          contract_ref: platform.governed-ai.intake-classification.v1
          contract_version: "1.0"
          contract_source_ref:
            repo: workspace-governance
            path: contracts/governed-intake-assist.yaml
          instruction_owner_repo: platform-engineering
          instruction_source: gateway-profile
          prompt_version: intake-classifier-v1.0
          provider_output_schema_ref:
            repo: platform-engineering
            path: security/schemas/intake-classification-result.schema.json
          input_contract:
            allowed_fields:
              - operator_supplied_intake_notes
              - model_safe_packet
            required_fields:
              - operator_supplied_intake_notes
    provider_output_schema_ref:
      repo: platform-engineering
      path: security/schemas/intake-classification-result.schema.json
    accepted_record_schema_ref:
      repo: workspace-governance
      path: contracts/schemas/intake-ai-suggestion.schema.json
    human_approval_required: true
    direct_provider_access_allowed: false
    security_review_ref:
      repo: security-architecture
      path: docs/reviews/platform/2026-08-20-intake-classifier-v1-local-ollama-binding.md
    future_paid_activation_ref: openproject://work_packages/864
    notes: >
      The logical profile is provider-neutral. Dev-integration selects the
      reviewed local Ollama binding. The paid OpenAI route remains recorded but
      inactive until its independent activation work is complete.
  delivery-work-design-advisor-v1:
    status: active
    purpose: delivery-work-design-assist
    invocation_path: governed-ai-gateway
    selected_binding_by_environment:
      dev-integration: local-ollama-qwen3-8b
    bindings:
      local-ollama-qwen3-8b:
        status: active
        environments:
          - dev-integration
        provider: ollama
        provider_route: ollama-local-host
        upstream_model: qwen3:8b
        model_digest: 500a1f067a9f782620b40bee6f7b0c89e17ae61f686b92c24933e4ca4b2b8b41
        runtime_version: 0.40.1
        selection:
          selected_at: "2026-08-25"
          selected_by: operator:workspace-owner
          basis: reviewed-local-work-design-devint-activation
          documentation_ref: https://ollama.com/library/qwen3:8b
    allowed_callers:
      - operator-orchestration-service/work-design-assist
    allowed_data_scope:
      - CGG receipt-bound model-safe Work Design content
      - CGG packet and redaction receipt references
      - operator-supplied Work Design prompt
      - OOS-owned versioned task instruction
    runtime_limits:
      max_request_bytes: 300000
      max_output_tokens: 2048
      timeout_seconds: 60
      retry_count: 1
      max_concurrency: 2
    task_contracts:
      allowed:
        context_advice:
          contract_ref: oos.delivery-work-design.v1
          contract_version: "1.0"
          contract_source_ref:
            repo: operator-orchestration-service
            path: contracts/work-design/manifest.json
          instruction_owner_repo: operator-orchestration-service
          instruction_source: caller
          provider_output_schema_ref:
            repo: platform-engineering
            path: security/schemas/delivery-work-design-advice.schema.json
          input_contract:
            allowed_fields:
              - task_instruction
              - operator_prompt
              - model_safe_packet
            required_fields:
              - task_instruction
              - operator_prompt
              - model_safe_packet
            model_safe_packet_required_fields:
              - packet_ref
              - redaction_receipt_ref
              - projection_receipt_ref
              - content
        tree_advice:
          contract_ref: oos.delivery-work-design.v1
          contract_version: "1.0"
          contract_source_ref:
            repo: operator-orchestration-service
            path: contracts/work-design/manifest.json
          instruction_owner_repo: operator-orchestration-service
          instruction_source: caller
          provider_output_schema_ref:
            repo: platform-engineering
            path: security/schemas/delivery-work-design-advice.schema.json
          input_contract:
            allowed_fields:
              - task_instruction
              - operator_prompt
              - model_safe_packet
            required_fields:
              - task_instruction
              - operator_prompt
              - model_safe_packet
            model_safe_packet_required_fields:
              - packet_ref
              - redaction_receipt_ref
              - projection_receipt_ref
              - content
    human_approval_required: true
    direct_provider_access_allowed: false
    security_review_ref:
      repo: security-architecture
      path: docs/reviews/components/2026-08-25-governed-work-design-ai-activation-boundary.md
    activation_review_ref: openproject://work_packages/994
    notes: >
      The Work Design profile and local Ollama binding are active only in
      dev-integration under the Security decision in #994 and Platform
      activation in #995. Console integration remains independently gated by
      #996. Paid-provider, stage, and prod activation remain prohibited.
